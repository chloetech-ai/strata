[package]
name = "chloectx"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "Automatic long-term context for coding agents, stored in ChloeDB"
publish = false

[dependencies]
chloedb = { path = "../chloedb" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
# Parsing what a caller's SQL is before it runs (`sqlguard`); the version
# ChloeDB parses with.
sqlparser = "0.59"
# Checking a downloaded model against its pinned SHA-256 (`fetch-model`).
sha2 = "0.10"
# chloectx app: a client of chloedb-server's HTTP API (as chloedb's own
# hosted models are).
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[features]
# BGE-small through candle: better vectors, ~50 ms per record on CPU.
bert = ["chloedb/bert"]
# `bert` with matrix products in Apple's Accelerate framework (macOS only).
accelerate = ["chloedb/accelerate"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2

# CI's tests (cargo test --profile ci): release's optimisation without its
# link-time optimisation and single codegen unit, which take most of the
# time of building the test binaries.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
