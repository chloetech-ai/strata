[package]
name = "chloedb-netops"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "Network operations on ChloeDB: topology, telemetry rollups, alerts written as SQL, incidents correlated over the topology graph, changes with their blast radius, and agents that show what they read"

# A client of chloedb-server over HTTP, as the crawler and the spreadsheets
# are: no ChloeDB crate in its build, so it runs beside a server or a cluster.
[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "fs", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "ansi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# CI's tests (cargo test --profile ci), as in the other crates.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
