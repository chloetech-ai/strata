[package]
name = "engram"
version = "0.1.0"
edition = "2021"
description = "Automatic long-term context for coding agents, stored in Strata"
publish = false

[dependencies]
strata = { path = "../strata" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
memmap2 = "0.9"
regex = "1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
# BGE-small through candle (feature `bert`): better vectors, ~50 ms per record on CPU.
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
candle-transformers = { version = "0.9", optional = true }

[features]
bert = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2
