name: CI runner

# CI's on-demand runner on DigitalOcean (.github/ci-runner/): ci.yml's job
# `runner` makes the droplet when a run needs it, and this workflow
# destroys it once no CI run has been queued or running for 15 minutes, so
# that it bills only while CI works (a powered-off droplet bills in full).
# Its build folders stay on the volume ci-runner-cache for the next one.
#
# - reap: after every CI run, and every 15 minutes in case a run's reaper
#   was cancelled or GitHub's schedule ran late. A newer reaper replaces the
#   one waiting, so the idle time counts from the last CI run that ended.
#   Whatever happens, a droplet older than 12 hours is destroyed once its
#   runners are idle, and one older than 14 hours regardless, and a droplet
#   whose runners never came online is destroyed after 11 minutes.
# - image: by hand, every month, and when .github/ci-runner/ changes on
#   main, builds the snapshot droplets start from (provision.sh on a fresh
#   Ubuntu droplet) and keeps the newest two.
#
# - place: when a CI run that is not main's is requested (a pull request's,
#   the merge queue's, a tag's), makes the droplet for it if it builds the
#   engine, and posts where its heavy jobs run as the commit status
#   `ci-runner`, which that run's job `runner` waits for: a branch's copy
#   of ci.yml runs without the secrets (audit 4, X-I2).
#
# Secrets: DIGITALOCEAN_TOKEN (the DigitalOcean API) and
# CI_RUNNER_ADMIN_TOKEN (Administration: read and write on this repository,
# for the runners' state), in the environment `ci-runner`, whose
# deployment branches are main alone (.github/ci-runner/README.md). This
# workflow runs only code from main: a workflow_run and a schedule take the
# default branch's files.
on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
  schedule:
    - cron: "*/15 * * * *"
    - cron: "41 4 3 * *"
  push:
    branches: [main]
    paths: [".github/ci-runner/**"]
  workflow_dispatch:
    inputs:
      job:
        description: reap, image, status or start (makes the droplet and waits for its runners, to test it)
        default: reap

permissions:
  contents: read
  actions: read

jobs:
  place:
    if: >-
      github.repository == 'chloetech-ai/chloedb' && github.event_name == 'workflow_run' &&
      github.event.action == 'requested' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !(github.event.workflow_run.event != 'pull_request' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ci-runner
    permissions:
      contents: read
      actions: read
      statuses: write
    concurrency:
      group: ci-runner-place-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-runner
      - name: Place the run's heavy jobs
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.CI_RUNNER_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          CI_RUNNER_SIZE: ${{ vars.CI_RUNNER_SIZE }}
          CI_RUNNER_REGION: ${{ vars.CI_RUNNER_REGION }}
          CI_RUNNER_COUNT: ${{ vars.CI_RUNNER_COUNT }}
          CI_RUNNER_HOSTED_LIMIT: ${{ vars.CI_RUNNER_HOSTED_LIMIT }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/ci-runner/ci_runner.py place

  reap:
    if: github.repository == 'chloetech-ai/chloedb' && ((github.event_name == 'workflow_run' && github.event.action == 'completed') || (github.event_name == 'schedule' && github.event.schedule == '*/15 * * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'reap'))
    environment: ci-runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: ci-runner-reap
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-runner
      - name: Destroy the droplet when CI is idle
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.CI_RUNNER_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ci-runner/ci_runner.py reap --idle 900 --patience 1200

  image:
    if: github.repository == 'chloetech-ai/chloedb' && (github.event_name == 'push' || (github.event_name == 'schedule' && github.event.schedule == '41 4 3 * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'image'))
    environment: ci-runner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ci-runner-image
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the snapshot
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CI_RUNNER_REGION: ${{ vars.CI_RUNNER_REGION }}
        run: |
          toolchain=$(sed -n 's/^  RUST_TOOLCHAIN: "\(.*\)"/\1/p' .github/workflows/ci.yml)
          python3 .github/ci-runner/ci_runner.py image --toolchain "${toolchain:-1.100.0}"

  # By hand: the droplet, its runners as GitHub sees them, and how busy
  # GitHub's own runners are.
  status:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'status'
    environment: ci-runner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-runner
      - name: Status
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.CI_RUNNER_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/ci-runner/ci_runner.py status

  # By hand: make the droplet now (or find it) and wait for its runners, as
  # CI's job `runner` does when GitHub's runners are full. The reaper
  # destroys it once CI has been idle 15 minutes.
  start:
    if: github.event_name == 'workflow_dispatch' && inputs.job == 'start'
    environment: ci-runner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-runner
      - name: Start
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          GH_ADMIN_TOKEN: ${{ secrets.CI_RUNNER_ADMIN_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          CI_RUNNER_REGION: ${{ vars.CI_RUNNER_REGION }}
          CI_RUNNER_SIZE: ${{ vars.CI_RUNNER_SIZE }}
          CI_RUNNER_COUNT: ${{ vars.CI_RUNNER_COUNT }}
        run: |
          python3 .github/ci-runner/ci_runner.py want --force --wait 420
          python3 .github/ci-runner/ci_runner.py status
