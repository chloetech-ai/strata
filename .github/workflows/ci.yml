name: CI

# A change to the documentation site or to Markdown files alone builds and
# tests nothing.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The jobs run on the organisation's own runners rather than GitHub's shared
# ones, so that they no longer wait for the plan's few concurrent jobs:
# gh-linux (Ubuntu 24.04, 4 cores, 16 GB) and gh-mac (macOS 26, 3 cores,
# 7 GB). Job names still say ubuntu-latest and macos-latest, which keeps the
# check names.
jobs:
  test:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        crate: [strata, engram, strata-server]
    runs-on: ${{ matrix.os == 'macos-latest' && 'gh-mac' || 'gh-linux' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The strata crate builds with -C target-cpu=native
      # (strata/.cargo/config.toml), so a cache must not be restored on a
      # runner with another CPU: the key hashes the model and its
      # instruction sets (runners with the same model name differ in them,
      # and a cached proc macro then dies of SIGILL).
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.crate }}
          key: ${{ matrix.crate }}-${{ steps.cpu.outputs.model }}
      # The ci profile is release without link-time optimisation and with
      # 16 codegen units (each crate's Cargo.toml): with release's, building
      # Strata's test binaries took 37 of the 40 minutes of its tests.
      # Strata's SQLite import and export (feature `sqlite`) are tested and
      # linted in the strata job; strata-server and the Python package turn
      # the feature on.
      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test --profile ci ${{ matrix.crate == 'strata' && '--features sqlite' || '' }}
      # Compiler warnings and clippy's correctness and suspicious lints fail
      # the build; style, complexity and performance lints are advice.
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --release --all-targets ${{ matrix.crate == 'strata' && '--features sqlite' || '' }} -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # strata-server, engram and the Python package build for a generic CPU,
  # where Strata chooses its SIMD kernels at run time: test the kernels in
  # such a build, then with every SIMD path turned off. A job of its own, so
  # that it runs beside the strata tests rather than after them.
  kernels:
    name: strata kernels on a generic build
    runs-on: gh-linux
    timeout-minutes: 30
    env:
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # A generic build runs on any x86-64 runner: no CPU model in the key.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata
          key: strata-generic
      - name: Kernels
        working-directory: strata
        run: |
          cargo test --profile ci --lib -- vector:: postings:: forward:: simd
          STRATA_SIMD=portable cargo test --profile ci --lib -- vector:: postings:: forward::

  # Images (feature `vision`: the image crate and SigLIP through candle),
  # which the default build leaves out: the tests of vectors of images in
  # Strata and through a server, with the `hash` model (SigLIP's weights
  # are not fetched here), and clippy over the feature's code.
  vision:
    name: images (feature vision)
    runs-on: gh-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: CPU model
        id: cpu
        run: echo "model=$(grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            strata
            strata-server
          key: vision-${{ steps.cpu.outputs.model }}
      - name: Strata
        working-directory: strata
        run: |
          cargo test --profile ci --features vision --test media_vectors --test media_fields --test derived_text
          cargo clippy --profile ci --features vision --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: strata-server
        working-directory: strata-server
        run: cargo test --profile ci --features vision --test media_vectors --test media

  # Sound (feature `audio`: symphonia's decoders, and Whisper and CLAP
  # through candle): decoding, resampling and mel features, text derived
  # from sound and vectors of it with test models (the real models' weights
  # are not fetched here), and clippy over the feature's code in Strata and
  # the server.
  audio:
    name: sound (feature audio)
    runs-on: gh-linux
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: CPU model
        id: cpu
        run: echo "model=$(grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            strata
            strata-server
          key: audio-${{ steps.cpu.outputs.model }}
      - name: Strata
        working-directory: strata
        run: |
          cargo test --profile ci --features audio --test derived_audio --test audio_vectors
          cargo test --profile ci --features audio --lib -- audio:: clap::
          cargo clippy --profile ci --features audio --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: strata-server
        working-directory: strata-server
        run: cargo clippy --profile ci --features audio -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # Power losses, full disks and failing syncs at every write of a storage
  # workload (storage::io, tests/storage_faults.rs). A job of its own: after
  # the strata tests, it took the macOS job past its hour.
  faults:
    name: fault injection on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && 'gh-mac' || 'gh-linux' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata
          key: strata-faults-${{ steps.cpu.outputs.model }}
      - name: Fault injection
        working-directory: strata
        run: cargo test --profile ci --features fault-injection --test storage_faults

  # BM25 through SQL on three BEIR collections against the committed
  # baseline (strata/tests/relevance_gate.rs): a ranking change must come
  # with its new numbers.
  relevance-gate:
    name: relevance gate (BEIR)
    runs-on: gh-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: CPU model
        id: cpu
        run: echo "model=$(grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata
          key: relevance-${{ steps.cpu.outputs.model }}
      - uses: actions/cache@v4
        with:
          path: ~/beir
          key: beir-${{ hashFiles('strata/tests/fixtures/beir/fetch.sh') }}
      - name: Collections
        run: strata/tests/fixtures/beir/fetch.sh "$HOME/beir"
      - name: Gate
        working-directory: strata
        run: STRATA_BEIR_DIR="$HOME/beir" STRATA_RELEVANCE_GATE=required cargo test --profile ci --test relevance_gate -- --nocapture

  # Miri runs the tests of Strata's zero-copy byte views (postings::bytes)
  # and of the structures read through them, checking every access for
  # undefined behaviour: misaligned or out-of-bounds reads, dangling
  # pointers, aliasing. It interprets the code about a thousand times
  # slower, and on one thread, so it runs the tests sized for it (`miri_*`)
  # and other small ones, split in three parts of 10 to 16 minutes, on a
  # portable build (scalar kernels; Miri has no CPUID). The nightly is
  # pinned to the one the tests were run with.
  miri:
    name: miri (${{ matrix.part }})
    runs-on: gh-linux
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: pyramid
            tests: "postings::codecs::pyramid::tests::miri_"
          - part: bytes, loom, bit vectors, query pool
            tests: "postings::bytes postings::codecs::loom::tests::miri_ postings::bits query::pool"
          - part: columns, graph, keys, text codec
            tests: "forward:: graph:: storage::pk::tests::collisions storage::pk::tests::section_written storage::live storage::updates::tests::round_trip text::codec --skip many_int_keys"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-27
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata
          key: miri
      - name: Miri
        working-directory: strata
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --no-default-features --lib -- ${{ matrix.tests }}

  server-smoke:
    name: strata-server smoke test
    runs-on: gh-linux
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: strata-server
          key: strata-server-smoke
      - name: Build
        working-directory: strata-server
        run: cargo build --release
      - name: Serve a demo catalogue and query it
        working-directory: strata-server
        run: |
          ./target/release/strata-server --demo 5000 --db "$RUNNER_TEMP/demo.strata" --listen 127.0.0.1:7700 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7700/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:7700/v1/health | grep -q '"ok"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT id, title, score() FROM products ORDER BY bm25(body, :q) DESC LIMIT 5", "params": {"q": "waterproof jacket"}}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT category, COUNT(*) FROM products GROUP BY category ORDER BY 2 DESC LIMIT 5"}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "WITH top AS (SELECT id FROM products ORDER BY bm25(body, '"'"'jaket'"'"', fuzzy => 1) DESC LIMIT 50) SELECT category, COUNT(*), AVG(price) FROM top GROUP BY category"}' \
            | grep -q '"rows"'
          curl -sf http://127.0.0.1:7700/metrics | grep -q strata_queries_total
          curl -sf http://127.0.0.1:7700/ | grep -qi '<html'
          # Rows into a new database from the command line, then over HTTP.
          printf '{"table": "t", "key": "id", "fields": [{"name": "id", "type": "keyword"}, {"name": "title", "type": "text"}]}' > "$RUNNER_TEMP/t.json"
          printf '{"id": "a", "title": "first row"}\n{"id": "b", "title": "second row", "extra": 1}\n' > "$RUNNER_TEMP/t.jsonl"
          ./target/release/strata-server import --db "$RUNNER_TEMP/t.strata" --schema "$RUNNER_TEMP/t.json" "$RUNNER_TEMP/t.jsonl"
          ./target/release/strata-server --db "$RUNNER_TEMP/t.strata" --listen 127.0.0.1:7702 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7702/v1/health && break; sleep 1; done
          printf 'id,title\nc,third row\n' | curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=csv' -H 'content-type: text/csv' --data-binary @- | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/health | grep -q '"docs":3'
          # A SQLite database's tables into a new database, and back out.
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); c.executescript(\"CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT, at DATETIME); INSERT INTO notes VALUES (1, 'a first note about rivers and mountains', '2026-10-01 12:00:00');\"); c.commit()" "$RUNNER_TEMP/s.sqlite"
          ./target/release/strata-server import --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s.sqlite"
          ./target/release/strata-server export --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s2.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute(\"SELECT notes.rowid, at FROM notes_fts JOIN notes ON notes.rowid = notes_fts.rowid WHERE notes_fts MATCH 'river'\").fetchall() == [(1, '2026-10-01 12:00:00')]" "$RUNNER_TEMP/s2.sqlite"
          # And over HTTP: the SQLite file into the running server, a new table, and the database back out.
          curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=sqlite' -H 'content-type: application/vnd.sqlite3' --data-binary @"$RUNNER_TEMP/s.sqlite" | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/export -o "$RUNNER_TEMP/s3.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute('SELECT count(*) FROM t').fetchone() == (3,); assert c.execute('SELECT body FROM notes').fetchall() == [('a first note about rivers and mountains',)]" "$RUNNER_TEMP/s3.sqlite"

  python:
    name: Python package on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os == 'macos-latest' && 'gh-mac' || 'gh-linux' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            strata-py
            strata-server
          key: python-${{ steps.cpu.outputs.model }}
      # The client tests run against a real server.
      - name: Build strata-server
        working-directory: strata-server
        run: cargo build --release
      # The Kafka consumer's exactly-once test runs against Redpanda, on
      # Linux only (macOS runners have no Docker); elsewhere it is skipped.
      - name: Start Redpanda
        if: runner.os == 'Linux'
        run: |
          docker run -d --name redpanda --network host docker.redpanda.com/redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned \
            --kafka-addr 127.0.0.1:19092 --advertise-kafka-addr 127.0.0.1:19092 \
            --rpc-addr 127.0.0.1:33145 --advertise-rpc-addr 127.0.0.1:33145 \
            --pandaproxy-addr 127.0.0.1:18082 --schema-registry-addr 127.0.0.1:18081
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy: *true' && break; sleep 1; done
          docker exec redpanda rpk cluster health
          echo "STRATA_KAFKA=127.0.0.1:19092" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: strata-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy confluent-kafka
          maturin develop --release
          pytest tests -v
      - name: Clippy
        working-directory: strata-py
        run: cargo clippy --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
