name: CI

# A change to the documentation site, to Markdown files or to benchmark
# results alone builds and tests nothing.
#
# Main is protected by one required check, "CI result", which every run
# reports: the jobs below run when a change touches more than the
# documentation and benchmark results (job `changes`), and are skipped
# otherwise, which a required check counts as passing. A workflow skipped
# by a path filter would report nothing, and the pull request would wait
# for its check forever.
on:
  push:
    branches: [main]
  pull_request:
  # The merge queue tests each pull request merged onto the main it will
  # land on, as a pull request is tested.
  merge_group:
  # Every night, main's whole matrix, macOS included, whether or not
  # anything merged: flaky tests show up there before they block a merge.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# A new push to a pull request cancels its older run. Pushes to main share
# one group that never cancels the run in progress, so main's runs keep
# finishing, but a group holds one waiting run and a newer push replaces
# it: after a burst of merges only the newest waits, and it tests every
# merge before it. (A group per commit queued every merge's whole run,
# 5 macOS jobs each against a limit of 5 at once, and the queue grew by
# hours.) The merge queue, the nightly run and a run by hand keep a group
# per event and commit, so none of them is dropped.
# The jobs only read the repository: the token gets no write rights.
permissions:
  contents: read

concurrency:
  group: ci-${{ (github.event_name == 'pull_request' || github.event_name == 'push') && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The Rust every job builds with, so that a new stable release on the
  # runners cannot turn main red (clippy 1.100 did, on 12 Nov 2026). Bump it
  # by hand, after `cargo +<new> clippy` passes in each crate. A new
  # version changes every rust-cache key, so the first runs after a bump
  # build cold: the kernels, the BEIR gate and the smoke test have 45
  # minutes rather than 30 for that.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

# The jobs run on GitHub's standard runners, which cost nothing for a public
# repository: ubuntu-latest (4 cores, 16 GB) and macos-latest (3 cores,
# 7 GB). The organisation's own runners (gh-linux, gh-mac and gh-mac2) are
# billed by the minute even for a public repository, so no job uses them.
# The exception is the on-demand runner (job `runner`): the longest jobs
# of a change to the engine or the server (the server's binary, ChloeDB's
# and the server's tests) go to a DigitalOcean droplet of 16 cores, which
# exists only while CI is busy; whenever it is not there, they run on
# ubuntu-latest. The variable CI_RUNNER=overflow sends them there only
# when GitHub's runners are full, and CI_RUNNER=off never.
#
# macOS jobs are the scarcest: the account runs five at once. A pull
# request and the merge queue run nothing on macOS (since 13 November: a
# pull request waited 9 to 12 minutes for a macOS runner and then 16 more,
# after every Linux job had passed). A push to main runs only ChloeDB's
# tests on macOS, where its NEON kernels and syncs differ from Linux, and
# CI result does not wait for them (job `macos`); its check still turns red
# on a failure. The nightly run and a run
# started by hand run every macOS job (8 of them), and CI result waits for
# each. (Until 8 November a push to main ran all 8 too: they took the five
# runners for up to 50 minutes a merge, and a pull request's macOS job
# waited 46 minutes behind them.)
#
# Caches (Swatinem/rust-cache, one per job) are saved by runs on main, the
# nightly and runs started by hand, and only restored by pull requests: a
# repository keeps 10 GB of caches, and with every pull request saving its
# own, main's were evicted and most jobs compiled every dependency (the
# Python job took 26 to 39 minutes that way, 20 with a cache). For the same
# reason Linux builds in chloedb/ name x86-64-v3 (AVX2, which every runner
# has) instead of its config's target-cpu=native, so that one cache serves
# every runner's CPU; on a runner with AVX-512 ChloeDB still picks those
# kernels at run time (chloedb::simd). macOS builds keep native, and the CPU
# in their cache's key.
jobs:
  # Which jobs the change needs (.github/scripts/ci_changes.py, whose
  # header lists the rules). A change to the documentation site, Markdown
  # files or benchmark results alone runs nothing; one only under an app or
  # a package (chloectx, chloedb-crawl, chloedb-sheets, chloedb-apps,
  # chloedb-py, chloedb-js, chloedb-java) runs that one's jobs and the jobs
  # that use it; one only under a demo (chloedb-netops, chloedb-swarm,
  # examples/feature-store, examples/parley) runs nothing here, since the
  # demos are tested by demos.yml; anything else (ChloeDB, chloedb-server,
  # the workflows, the scripts, a file at the root) runs everything. The
  # nightly run and a run by hand always run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Changed files
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 .github/scripts/ci_changes.py --self-test
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            merge_group) base="$QUEUE_BASE" ;;
            push) base="$BEFORE" ;;
            *) base="" ;;
          esac
          # A diff needs only the two commits' trees, not the history
          # between them. No base (a new branch, the nightly run, a run by
          # hand) or one that cannot be fetched (a force push): test
          # everything.
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git fetch --no-tags --depth=1 origin "$base"; then
            python3 .github/scripts/ci_changes.py --all | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" HEAD | tee "$RUNNER_TEMP/changed"
          python3 .github/scripts/ci_changes.py < "$RUNNER_TEMP/changed" | tee -a "$GITHUB_OUTPUT"

  # Where the longest jobs run (chloedb-server's binary, ChloeDB's and the
  # server's tests): on the on-demand runner, a DigitalOcean droplet made
  # when a run needs it and destroyed once CI has been idle 15 minutes (.github/ci-runner/, and ci-runner.yml, which
  # destroys it), unless it is off, busy, not set up or does not come up in
  # 4 minutes. A pull
  # request from a fork never gets it: the secrets are not passed to it,
  # and the runner's job-started hook refuses its jobs (job-started.sh).
  #
  # The secrets that make the droplet (DIGITALOCEAN_TOKEN, and
  # CI_RUNNER_ADMIN_TOKEN, which has Administration on the repository) are
  # in the environment `ci-runner`, which only main may use: a branch's
  # copy of this file runs with neither (audit 4, X-I2). Main's runs (a
  # push, the nightly, a run by hand) make the droplet here; any other run
  # (a pull request's, the merge queue's, a tag's) waits for ci-runner.yml's
  # job `place`, which runs main's code with the secrets and posts the
  # label as the commit status `ci-runner`.
  runner:
    name: runner
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.ref == 'refs/heads/main' && 'ci-runner' || '' }}
    # Reads how busy GitHub's runners are (the repository's runs and jobs),
    # and outside main the status `place` posts.
    permissions:
      contents: read
      actions: read
      statuses: read
    outputs:
      label: ${{ steps.want.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github/ci-runner
      - name: Runner
        id: want
        env:
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          DIGITALOCEAN_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.DIGITALOCEAN_TOKEN || '' }}
          GH_ADMIN_TOKEN: ${{ github.ref == 'refs/heads/main' && secrets.CI_RUNNER_ADMIN_TOKEN || '' }}
          CI_RUNNER: ${{ vars.CI_RUNNER }}
          CI_RUNNER_SIZE: ${{ vars.CI_RUNNER_SIZE }}
          CI_RUNNER_REGION: ${{ vars.CI_RUNNER_REGION }}
          CI_RUNNER_COUNT: ${{ vars.CI_RUNNER_COUNT }}
          CI_RUNNER_HOSTED_LIMIT: ${{ vars.CI_RUNNER_HOSTED_LIMIT }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$SAME_REPO" != true ]; then echo "label=ubuntu-latest" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$ON_MAIN" = true ]; then
            python3 .github/ci-runner/ci_runner.py want >> "$GITHUB_OUTPUT"
          else
            python3 .github/ci-runner/ci_runner.py placed >> "$GITHUB_OUTPUT"
          fi

  # chloedb-server's release binary, built once for every job that runs it
  # (the smoke test, the Python and JavaScript packages, the guide's pages),
  # each of which built it for 11 minutes before. It is kept in a cache
  # keyed by the source it is built from (the trees of chloedb/,
  # chloedb-server/ and docs/chloedb/, which it includes, and the Rust
  # version): a change that touches none of them, such as one to an app,
  # takes main's binary from the cache and builds nothing. Main, the nightly
  # run and runs by hand save the cache; a pull request only reads it.
  server-bin:
    name: chloedb-server binary
    needs: [changes, runner]
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.run).server }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Source key
        id: key
        run: echo "key=chloedb-server-bin-${{ runner.os }}-${RUST_TOOLCHAIN}-$(git rev-parse HEAD:chloedb HEAD:chloedb-server HEAD:docs/chloedb | sha256sum | cut -c1-24)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          # A path in the workspace: the cache's version hashes it, and the
          # temporary folder of the on-demand runner is not GitHub's.
          path: .server-bin
          key: ${{ steps.key.outputs.key }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.cache.outputs.cache-hit != 'true' && runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb-server
          key: server-bin
      - name: Build folder
        if: steps.cache.outputs.cache-hit != 'true'
        run: .github/ci-runner/target-dir.sh server-release
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: chloedb-server
        run: |
          cargo build --locked --release
          mkdir -p ../.server-bin
          cp "${CARGO_TARGET_DIR:-target}/release/chloedb-server" ../.server-bin/
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        with:
          path: .server-bin
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chloedb-server
          path: .server-bin/chloedb-server
          retention-days: 3
          if-no-files-found: error

  test:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    needs: [changes, runner]
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.run).test }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
        # chloedb-crawl's crawl into a real cluster, and chloedb-sheets'
        # workbooks in one, run in server-smoke, which builds chloedb-server;
        # here their other tests and clippy.
        crate: ${{ fromJSON(needs.changes.outputs.run).crates }}
    # chloedb-server's and ChloeDB's tests, the longest jobs, run on the
    # on-demand runner when it is up (job `runner`).
    runs-on: ${{ matrix.os == 'ubuntu-latest' && (matrix.crate == 'chloedb-server' || matrix.crate == 'chloedb') && needs.runner.outputs.label || (matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os) }}
    # rust-cache saves only from a job that passed, so a macOS job that ran
    # out of time starts the next one cold too: chloedb-server's tests took
    # 59 minutes from a cold build on the macOS runner on 11-08, and Clippy
    # after them did not fit in 60.
    timeout-minutes: ${{ matrix.os == 'macos-latest' && (vars.MAC_RUNNER && 150 || 90) || 60 }}
    env: &test-env
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.crate == 'chloedb' && '-C target-cpu=x86-64-v3' || '' }}
      # On Linux, GitHub's runners and the on-demand one have Postgres, and
      # tests/postgres.rs fails rather than skips without it (audit 4, X-I3).
      CHLOEDB_TEST_POSTGRES_REQUIRED: ${{ matrix.crate == 'chloedb-server' && matrix.os == 'ubuntu-latest' && '1' || '' }}
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # On macOS the chloedb crate builds with -C target-cpu=native
      # (chloedb/.cargo/config.toml), so its cache must not be restored on a
      # runner with another CPU: the key hashes the model and its
      # instruction sets (runners with the same model name differ in them,
      # and a cached proc macro then dies of SIGILL).
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # The key names this job (`test`) rather than leaving the job's id to
      # rust-cache, so that the macOS job of a push to main (`macos`, the
      # same steps) and the nightly run share one cache. The on-demand
      # runner keeps its build folders instead (next step).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: runner.environment == 'github-hosted'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: ${{ matrix.crate }}
          shared-key: ${{ matrix.crate }}${{ runner.os == 'macOS' && matrix.crate == 'chloedb' && format('-{0}', steps.cpu.outputs.model) || '' }}-test
      # The ci profile is release without link-time optimisation and with
      # 16 codegen units (each crate's Cargo.toml): with release's, building
      # ChloeDB's test binaries took 37 of the 40 minutes of its tests.
      # ChloeDB's SQLite import and export (feature `sqlite`) are tested and
      # linted in the chloedb job; chloedb-server and the Python package turn
      # the feature on. --no-fail-fast runs every test binary even after one
      # fails: cargo stops at the first otherwise, and from 11-05 to 11-07 a
      # failing unit test of engine-compare kept chloedb-server's integration
      # tests from running on macOS at all.
      - name: Build folder
        shell: bash
        env:
          CRATE: ${{ matrix.crate }}
        run: .github/ci-runner/target-dir.sh "$CRATE"
      - name: Tests
        working-directory: ${{ matrix.crate }}
        run: cargo test --locked --profile ci --no-fail-fast ${{ matrix.crate == 'chloedb' && '--features sqlite' || '' }}
      # The cluster simulator over more seeds than its tests run (`cargo
      # test` built chloedb-sim): the first 3,000 of each world on every
      # change, and in the nightly run and a run started by hand 30,000 of
      # each that no run checked before, a new range each day; a third as
      # many with calls lost and with copies arriving late. A seed
      # replays exactly: `chloedb-sim --seed N --trace` (with `--cluster`
      # for the second world) shows what happened in it.
      - name: Simulator seeds
        if: matrix.crate == 'chloedb-server' && runner.os == 'Linux'
        working-directory: chloedb-server
        shell: bash
        env:
          NEW_SEEDS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: |
          n=3000
          from=0
          if [ "$NEW_SEEDS" = true ]; then
            n=30000
            from=$(( 1000000 + $(date -u +%s) / 86400 * n ))
          fi
          status=0
          sim() {
            echo "chloedb-sim $*"
            if ! "${CARGO_TARGET_DIR:-target}/ci/chloedb-sim" "$@" | tee "$RUNNER_TEMP/sim.out"; then
              status=1
              { echo "### chloedb-sim $*"; echo '```'; tail -n 60 "$RUNNER_TEMP/sim.out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          sim --seeds "$from..$((from + n))"
          sim --seeds "$from..$((from + n / 3))" --drop-ppm 150000
          sim --seeds "$from..$((from + n / 3))" --late-copies
          sim --cluster --seeds "$from..$((from + n))"
          exit $status
      # Compiler warnings and clippy's correctness and suspicious lints fail
      # the build; style, complexity and performance lints are advice.
      - name: Clippy
        working-directory: ${{ matrix.crate }}
        run: cargo clippy --locked --release --all-targets ${{ matrix.crate == 'chloedb' && '--features sqlite' || '' }} -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The macOS jobs run on the user's Mac (self-hosted runners labelled
  # `chloedb-mac`) when the repository variable MAC_RUNNER names that
  # label; unset, they run on macos-latest. macOS jobs run only on a push
  # to main, the nightly run and by hand, never on a pull request, so no
  # outside code reaches the Mac. Unset the variable to switch back. The
  # Mac runs two jobs at once beside its owner's work, so its jobs get
  # twice the time (fault injection ran past 60 minutes there on 11-14).
  #
  # ChloeDB's tests on macOS for a push to main: the `test` job's steps, in
  # a job of its own that CI result does not wait for (see the top of this
  # file). A pull request and the merge queue skip it. In the nightly run
  # and a run started by hand they run in `test`, and this job is skipped.
  macos:
    name: ${{ matrix.crate }} on ${{ matrix.os }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full && github.event_name == 'push'
    strategy:
      matrix:
        os: [macos-latest]
        crate: [chloedb]
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER && 120 || 60 }}
    env: *test-env
    steps: *test-steps

  # chloedb-server, chloectx and the Python package build for a generic CPU,
  # where ChloeDB chooses its SIMD kernels at run time: test the kernels in
  # such a build, then with every SIMD path turned off. A job of its own, so
  # that it runs beside the chloedb tests rather than after them.
  kernels:
    name: chloedb kernels on a generic build
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -C target-cpu=x86-64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      # A generic build runs on any x86-64 runner: no CPU model in the key.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: chloedb-generic
      - name: Kernels
        working-directory: chloedb
        run: |
          cargo test --locked --profile ci --lib -- vector:: postings:: forward:: simd
          CHLOEDB_SIMD=portable cargo test --locked --profile ci --lib -- vector:: postings:: forward::

  # Images (feature `vision`: the image crate and SigLIP through candle),
  # which the default build leaves out: the tests of vectors of images in
  # ChloeDB and through a server, with the `hash` model (SigLIP's weights
  # are not fetched here), and clippy over the feature's code. `vision`
  # includes `bert`, so the cross-encoder tests against transformers'
  # scores of the small models in chloedb/tests/models run here too.
  # Two parts that run at once, ChloeDB's and the server's: each builds
  # candle on its own, and one after the other they took 31 minutes.
  vision:
    name: images (feature vision, ${{ matrix.part }})
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [chloedb, chloedb-server]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: ${{ matrix.part }}
          key: vision-${{ matrix.part }}
      - name: ChloeDB
        if: matrix.part == 'chloedb'
        working-directory: chloedb
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo test --locked --profile ci --features vision --test media_vectors --test media_fields --test derived_text --test rank_cross
          cargo clippy --locked --profile ci --features vision --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: chloedb-server
        if: matrix.part == 'chloedb-server'
        working-directory: chloedb-server
        run: cargo test --locked --profile ci --features vision --test media_vectors --test media

  # Sound (feature `audio`: symphonia's decoders, and Whisper and CLAP
  # through candle): decoding, resampling and mel features, text derived
  # from sound and vectors of it with test models (the real models' weights
  # are not fetched here), and clippy over the feature's code in ChloeDB and
  # the server.
  audio:
    name: sound (feature audio)
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb
            chloedb-server
          key: audio
      - name: ChloeDB
        working-directory: chloedb
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
        run: |
          cargo test --locked --profile ci --features audio --test derived_audio --test audio_vectors
          cargo test --locked --profile ci --features audio --lib -- audio:: clap::
          cargo clippy --locked --profile ci --features audio --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings
      - name: chloedb-server
        working-directory: chloedb-server
        run: cargo clippy --locked --profile ci --features audio -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # DataFusion as the engine of plans' operators (feature `datafusion`,
  # chloedb::query::df): the differential test against ChloeDB's own
  # operators, window functions on both engines against SQLite's answers,
  # the compound-query suites again with DataFusion as the engine
  # (CHLOEDB_ENGINE=datafusion: a plan it does not lower runs on the
  # operators), Parquet files in and out (feature parquet, on DataFusion's
  # Arrow) with s3:// URLs (feature s3), and clippy over the features' code.
  # The tests build with one set of features (datafusion, sqlite, parquet,
  # s3), so ChloeDB and DataFusion compile once rather than once for each of
  # three sets, and clippy runs at the same time in a part of its own: in
  # one job, one after the other, they took 35 minutes.
  datafusion:
    name: DataFusion engine (feature datafusion, ${{ matrix.part }})
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [tests, clippy]
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: datafusion-${{ matrix.part }}
      - name: ChloeDB
        if: matrix.part == 'tests'
        working-directory: chloedb
        run: |
          f=datafusion,sqlite,parquet,s3
          cargo test --locked --profile ci --features $f --test datafusion_engine --test hash_function --test window_functions --test set_operations --test pack --test deep_statements
          CHLOEDB_ENGINE=datafusion cargo test --locked --profile ci --features $f --test compound_queries --test joins_across_tables --test operators --test distinct_on --test per_cap --test one_evaluator --test sql_tables --test correlated --test query_memory --test plan_ir --test json_fields --test json_columns
          # Parquet files in and out, and s3:// URLs (chloedb::parquet, chloedb::objects)
          cargo test --locked --profile ci --features $f --test parquet
          cargo test --locked --profile ci --features $f --lib -- parquet:: objects:: arrow_rows::
      - name: Clippy
        if: matrix.part == 'clippy'
        working-directory: chloedb
        run: cargo clippy --locked --profile ci --features datafusion,parquet,s3 --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # Power losses, full disks and failing syncs at every write of a storage
  # workload (storage::io, tests/storage_faults.rs). A job of its own: after
  # the chloedb tests, it took the macOS job past its hour.
  faults:
    name: fault injection on ${{ matrix.os }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER && 120 || 60 }}
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: CPU model
        id: cpu
        shell: bash
        run: echo "model=$( (if [ -r /proc/cpuinfo ]; then grep -e 'model name' -e '^flags' /proc/cpuinfo | sort -u; else sysctl -n machdep.cpu.brand_string; fi) | cksum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: chloedb-faults${{ runner.os == 'macOS' && format('-{0}', steps.cpu.outputs.model) || '' }}
      - name: Fault injection
        working-directory: chloedb
        run: cargo test --locked --profile ci --features fault-injection --test storage_faults

  # BM25 through SQL on three BEIR collections, and with the analyzers of
  # other languages on two MIRACL collections, against the committed
  # baselines (chloedb/tests/relevance_gate.rs): a ranking change must come
  # with its new numbers.
  relevance-gate:
    name: relevance gate (BEIR)
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: relevance
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/beir
          key: beir-${{ hashFiles('chloedb/tests/fixtures/beir/fetch.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/miracl
          key: miracl-${{ hashFiles('chloedb/tests/fixtures/miracl/fetch.sh') }}
      - name: Collections
        run: |
          chloedb/tests/fixtures/beir/fetch.sh "$HOME/beir"
          chloedb/tests/fixtures/miracl/fetch.sh "$HOME/miracl" yo sw
      - name: Gate
        working-directory: chloedb
        run: CHLOEDB_BEIR_DIR="$HOME/beir" CHLOEDB_MIRACL_DIR="$HOME/miracl" CHLOEDB_RELEVANCE_GATE=required cargo test --locked --profile ci --test relevance_gate -- --nocapture

  # BM25's top 20 reranked by the cross-encoder ms-marco-MiniLM-L-6-v2 on
  # SciFact and NFCorpus, against its own baseline
  # (tests/fixtures/relevance_gate_cross_encoder.json). A job of its own:
  # the model scores 12,000 pairs, about ten minutes on four cores.
  relevance-gate-cross-encoder:
    name: relevance gate (cross-encoder)
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: -C target-cpu=x86-64-v3
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: relevance-bert
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/beir
          key: beir-${{ hashFiles('chloedb/tests/fixtures/beir/fetch.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/models
          key: cross-encoder-${{ hashFiles('chloedb/tests/models/fetch_cross_encoder.sh') }}
      - name: Collections and model
        run: |
          chloedb/tests/fixtures/beir/fetch.sh "$HOME/beir"
          chloedb/tests/models/fetch_cross_encoder.sh "$HOME/models"
      - name: Gate
        working-directory: chloedb
        run: CHLOEDB_BEIR_DIR="$HOME/beir" CHLOEDB_MODELS="$HOME/models" CHLOEDB_RELEVANCE_GATE=required cargo test --locked --profile ci --features bert --test relevance_gate cross_encoder -- --nocapture

  # Miri runs the tests of ChloeDB's zero-copy byte views (postings::bytes)
  # and of the structures read through them, checking every access for
  # undefined behaviour: misaligned or out-of-bounds reads, dangling
  # pointers, aliasing. It interprets the code about a thousand times
  # slower, and on one thread, so it runs the tests sized for it (`miri_*`)
  # and other small ones, split in four parts of 6 to 12 minutes (the
  # pyramid's is one test of 11), on a portable build (scalar kernels; Miri
  # has no CPUID). The nightly is pinned to the one the tests were run with.
  miri:
    name: miri (${{ matrix.part }})
    needs: changes
    if: fromJSON(needs.changes.outputs.run).full
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: pyramid
            tests: "postings::codecs::pyramid::tests::miri_"
          # The bit vectors' tests take 10 of these two parts' 12 minutes:
          # one of them goes with the others, so that a new one lands in
          # the first part.
          - part: bit vectors
            tests: "postings::bits --skip postings::bits::tests::next_one_and_ones"
          - part: bytes, loom, bit vector ones, query pool, substring
            tests: "postings::bytes postings::codecs::loom::tests::miri_ postings::bits::tests::next_one_and_ones query::pool substring::tests::miri_"
          - part: columns, graph, keys, text codec
            tests: "forward:: graph:: storage::pk::tests::collisions storage::pk::tests::section_written storage::live storage::updates::tests::round_trip text::codec --skip many_int_keys"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-10-27
          components: miri, rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb
          key: miri
      - name: Miri
        working-directory: chloedb
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-disable-isolation
        run: cargo miri test --no-default-features --lib -- ${{ matrix.tests }}

  server-smoke:
    name: chloedb-server smoke test
    needs: [changes, server-bin]
    if: ${{ !cancelled() && needs.server-bin.result == 'success' && fromJSON(needs.changes.outputs.run).smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-server
            chloedb-crawl
            chloedb-sheets
            chloectx
          key: chloedb-server-smoke
      # chloedb-server's binary from job server-bin.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chloedb-server
          path: chloedb-server/target/release
      - name: chloedb-server from job server-bin
        run: chmod +x chloedb-server/target/release/chloedb-server && chloedb-server/target/release/chloedb-server --version
      - name: Serve a demo catalogue and query it
        working-directory: chloedb-server
        run: |
          ./target/release/chloedb-server --demo 5000 --db "$RUNNER_TEMP/demo.strata" --listen 127.0.0.1:7700 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7700/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:7700/v1/health | grep -q '"ok"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT id, title, score() FROM products ORDER BY bm25(body, :q) DESC LIMIT 5", "params": {"q": "waterproof jacket"}}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "SELECT category, COUNT(*) FROM products GROUP BY category ORDER BY 2 DESC LIMIT 5"}' \
            | grep -q '"rows"'
          curl -sf -X POST http://127.0.0.1:7700/v1/query -H 'content-type: application/json' \
            -d '{"sql": "WITH top AS (SELECT id FROM products ORDER BY bm25(body, '"'"'jaket'"'"', fuzzy => 1) DESC LIMIT 50) SELECT category, COUNT(*), AVG(price) FROM top GROUP BY category"}' \
            | grep -q '"rows"'
          curl -sf http://127.0.0.1:7700/metrics | grep -q chloedb_queries_total
          curl -sf http://127.0.0.1:7700/ | grep -qi '<html'
          # Rows into a new database from the command line, then over HTTP.
          printf '{"table": "t", "key": "id", "fields": [{"name": "id", "type": "keyword"}, {"name": "title", "type": "text"}]}' > "$RUNNER_TEMP/t.json"
          printf '{"id": "a", "title": "first row"}\n{"id": "b", "title": "second row", "extra": 1}\n' > "$RUNNER_TEMP/t.jsonl"
          ./target/release/chloedb-server import --db "$RUNNER_TEMP/t.strata" --schema "$RUNNER_TEMP/t.json" "$RUNNER_TEMP/t.jsonl"
          ./target/release/chloedb-server --db "$RUNNER_TEMP/t.strata" --listen 127.0.0.1:7702 --grpc off &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:7702/v1/health && break; sleep 1; done
          printf 'id,title\nc,third row\n' | curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=csv' -H 'content-type: text/csv' --data-binary @- | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/health | grep -q '"docs":3'
          # A SQLite database's tables into a new database, and back out.
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); c.executescript(\"CREATE TABLE notes (id INTEGER PRIMARY KEY, body TEXT, at DATETIME); INSERT INTO notes VALUES (1, 'a first note about rivers and mountains', '2026-10-01 12:00:00');\"); c.commit()" "$RUNNER_TEMP/s.sqlite"
          ./target/release/chloedb-server import --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s.sqlite"
          ./target/release/chloedb-server export --db "$RUNNER_TEMP/s.strata" "$RUNNER_TEMP/s2.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute(\"SELECT notes.rowid, at FROM notes_fts JOIN notes ON notes.rowid = notes_fts.rowid WHERE notes_fts MATCH 'river'\").fetchall() == [(1, '2026-10-01 12:00:00')]" "$RUNNER_TEMP/s2.sqlite"
          # And over HTTP: the SQLite file into the running server, a new table, and the database back out.
          curl -sf -X POST 'http://127.0.0.1:7702/v1/import?format=sqlite' -H 'content-type: application/vnd.sqlite3' --data-binary @"$RUNNER_TEMP/s.sqlite" | grep -q '"written":1'
          curl -sf http://127.0.0.1:7702/v1/export -o "$RUNNER_TEMP/s3.sqlite"
          python3 -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute('SELECT count(*) FROM t').fetchone() == (3,); assert c.execute('SELECT body FROM notes').fetchall() == [('a first note about rivers and mountains',)]" "$RUNNER_TEMP/s3.sqlite"
      # The crawler on a site its test serves, into a cluster of this
      # build's servers that it starts and grows to three shards.
      - name: Crawl a site into a growing cluster
        if: fromJSON(needs.changes.outputs.run).smoke_crawl
        working-directory: chloedb-crawl
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_CRAWL_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test site
      # Spreadsheets kept in a server of this build: made, changed,
      # imported (CSV, SQLite), filled by a query, saved as a table,
      # searched, exported, and read back after a restart.
      - name: Workbooks in a cluster
        if: fromJSON(needs.changes.outputs.run).smoke_sheets
        working-directory: chloedb-sheets
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOEDB_SHEETS_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test cluster
      # The demos (chloedb-netops, chloedb-swarm, examples/feature-store,
      # examples/parley) are tested on a train of their own, demos.yml,
      # outside CI result.
      # ChloeCtx as an app of a cluster of this build's servers (two shards
      # and a coordinator): spaces, notes, contexts within a budget, an
      # exchange distilled by a stub model, incidents matched to an alert
      # that fires, and a restart.
      - name: ChloeCtx in a cluster
        if: fromJSON(needs.changes.outputs.run).smoke_ctx
        working-directory: chloectx
        env:
          CHLOEDB_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          CHLOECTX_NEED_SERVER: "1"
        run: cargo test --locked --profile ci --test app_cluster
      # The app engine (chloedb-apps, a prototype in Node): apps built from
      # plans, stored as SQL rows in a server of this build, run, tested and
      # searched; no model is called.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: fromJSON(needs.changes.outputs.run).smoke_apps
        with:
          node-version: "22"
      - name: App engine against a server
        if: fromJSON(needs.changes.outputs.run).smoke_apps
        working-directory: chloedb-apps
        env:
          # The app engine reads its settings by their old names for now.
          STRATA_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          STRATA_APPS_NEED_SERVER: "1"
        # The library is searched by meaning too: the model its meaning
        # column names must be there before the tests write rows.
        run: |
          for i in 1 2 3; do "$STRATA_SERVER_BIN" fetch-model potion-retrieval-32M && break; sleep 10; done
          npm ci
          npm test
      # The same tests on a cluster, as the operator's spec.apps runs it: a
      # coordinator over two shards, which walks no graphs (the engine
      # walks its own) and serves no feed.
      - name: App engine on a cluster of two shards
        if: fromJSON(needs.changes.outputs.run).smoke_apps
        working-directory: chloedb-apps
        env:
          STRATA_SERVER_BIN: ${{ github.workspace }}/chloedb-server/target/release/chloedb-server
          STRATA_APPS_NEED_SERVER: "1"
          STRATA_APPS_TEST_SHARDS: "2"
        run: npm test

  python:
    name: Python package on ${{ matrix.os }}
    needs: [changes, server-bin]
    if: ${{ !cancelled() && needs.server-bin.result == 'success' && fromJSON(needs.changes.outputs.run).python }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER && 120 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # chloedb-py and chloedb-server build for a generic CPU: one cache on
      # every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-py
            chloedb-server
          shared-key: python
      # The client tests run against a real server: on Linux the one job
      # server-bin built, on macOS (the nightly run) one built here.
      # chloedb-server's binary from job server-bin.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Linux'
        with:
          name: chloedb-server
          path: chloedb-server/target/release
      - name: chloedb-server from job server-bin
        if: runner.os == 'Linux'
        run: chmod +x chloedb-server/target/release/chloedb-server && chloedb-server/target/release/chloedb-server --version
      - name: Build chloedb-server
        if: runner.os != 'Linux'
        working-directory: chloedb-server
        run: cargo build --locked --release
      # The Kafka consumer's exactly-once test runs against Redpanda, on
      # Linux only (macOS runners have no Docker); elsewhere it is skipped.
      - name: Start Redpanda
        if: runner.os == 'Linux'
        run: |
          docker run -d --name redpanda --network host docker.redpanda.com/redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --memory 1G --overprovisioned \
            --kafka-addr 127.0.0.1:19092 --advertise-kafka-addr 127.0.0.1:19092 \
            --rpc-addr 127.0.0.1:33145 --advertise-rpc-addr 127.0.0.1:33145 \
            --pandaproxy-addr 127.0.0.1:18082 --schema-registry-addr 127.0.0.1:18081
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health 2>/dev/null | grep -q 'Healthy: *true' && break; sleep 1; done
          docker exec redpanda rpk cluster health
          echo "CHLOEDB_KAFKA=127.0.0.1:19092" >> "$GITHUB_ENV"
      - name: Build and test
        working-directory: chloedb-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin pytest numpy confluent-kafka
          # Database.query_arrow's and the Parquet tests (tests/test_arrow.py,
          # tests/test_parquet.py), the S3 ones against moto's local server
          pip install pyarrow polars pandas "moto[server]" boto3
          # The framework adapters' tests (tests/test_langchain.py,
          # test_langgraph.py, test_llama_index.py)
          pip install langchain-core langgraph llama-index-core
          # strata.train.sequence's test: CPU PyTorch (PyPI's macOS wheel is one)
          if [ "$RUNNER_OS" = Linux ]; then pip install torch --index-url https://download.pytorch.org/whl/cpu; else pip install torch; fi
          # The ci profile, as the crates' tests have: release's link-time
          # optimisation and single codegen unit took most of this step.
          maturin develop --profile ci --locked
          pytest tests -v
      # On Linux the recommender gate and Clippy run in job python-gate, at
      # the same time as these tests (one after the other they took 23
      # minutes, the longest job of a run once the engine's tests moved to
      # the on-demand runner).
      - name: Clippy
        if: runner.os != 'Linux'
        working-directory: chloedb-py
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The Python package's recommender gate and Clippy, on Linux, beside job
  # python's tests rather than after them. It needs no chloedb-server.
  python-gate:
    name: Python package, recommender gate and clippy
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.run).python }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # Job python's cache (the same shared-key), read only: that job saves it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: false
          workspaces: |
            chloedb-py
            chloedb-server
          shared-key: python
      - name: Build
        working-directory: chloedb-py
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install maturin numpy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          maturin develop --profile ci --locked
      # The recommender gate (chloedb/results/sequence/gate.py): every
      # candidate source and two baselines on MovieLens-1M, checked against
      # chloedb/tests/fixtures/recsys_gate.json and recsys_gate_time.json.
      # The ratings come from a mirror on Hugging Face, pinned by revision
      # and SHA-256. The two protocols run at once, a process each (one
      # after the other they took 6 and 2 minutes), and their output is
      # printed when both have ended.
      - name: Recommender gate
        working-directory: chloedb-py
        run: |
          . .venv/bin/activate
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/ml-1m-ratings.csv" https://huggingface.co/datasets/hazemessam/ml-1m/resolve/b7ed0ffb2157bfbc794a1e47e9044ab323bee57f/ratings.csv
          echo "d2baa264e8ef4c7fb0c555acae5dc80239612481efff5814df9eab98cb9e1fe0  $RUNNER_TEMP/ml-1m-ratings.csv" | sha256sum -c
          for protocol in loo time; do
            python ../chloedb/results/sequence/gate.py --ratings "$RUNNER_TEMP/ml-1m-ratings.csv" --protocol "$protocol" > "$RUNNER_TEMP/gate-$protocol.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/gate-$protocol.pid"
          done
          status=0
          for protocol in loo time; do
            wait "$(cat "$RUNNER_TEMP/gate-$protocol.pid")" || status=1
            cat "$RUNNER_TEMP/gate-$protocol.log"
          done
          exit $status
      - name: Clippy
        working-directory: chloedb-py
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  javascript:
    name: JavaScript package on ${{ matrix.os }}
    needs: [changes, server-bin]
    if: ${{ !cancelled() && needs.server-bin.result == 'success' && fromJSON(needs.changes.outputs.run).javascript }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER && 120 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      # setup-bun and setup-deno download from GitHub's releases, which
      # answered the runners 504 for an hour on 8 November; npm's registry
      # has the same Bun and Deno.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        id: bun
        continue-on-error: true
      - if: steps.bun.outcome == 'failure'
        run: npm install -g bun && bun --version
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        id: deno
        continue-on-error: true
        with:
          deno-version: v2.x
      - if: steps.deno.outcome == 'failure'
        run: npm install -g deno && deno --version
      # chloedb-js and chloedb-server build for a generic CPU: one cache on
      # every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: |
            chloedb-js
            chloedb-server
          key: javascript
      # The client tests run against a real server: on Linux the one job
      # server-bin built, on macOS (the nightly run) one built here.
      # chloedb-server's binary from job server-bin.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: runner.os == 'Linux'
        with:
          name: chloedb-server
          path: chloedb-server/target/release
      - name: chloedb-server from job server-bin
        if: runner.os == 'Linux'
        run: chmod +x chloedb-server/target/release/chloedb-server && chloedb-server/target/release/chloedb-server --version
      - name: Build chloedb-server
        if: runner.os != 'Linux'
        working-directory: chloedb-server
        run: cargo build --locked --release
      - name: Build and test
        working-directory: chloedb-js
        run: |
          node scripts/build.mjs --profile ci --locked
          node --test test/*.test.mjs
      # The same addon from Bun and Deno: a file opened, written and
      # searched in each runtime, and the client against a server.
      - name: Bun and Deno
        working-directory: chloedb-js
        run: |
          bun test/runtimes.mjs
          deno run --allow-ffi --allow-read --allow-write --allow-env --allow-net --allow-run --allow-sys test/runtimes.mjs
      - name: Clippy
        working-directory: chloedb-js
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The Java package (chloedb-java): its native library, built by cargo
  # inside mvn package, and the Java classes' tests against it on the
  # oldest Java the package supports (11) and on the newest long-term one,
  # which warns about native libraries loaded without
  # --enable-native-access.
  java:
    name: Java package on ${{ matrix.os }}
    needs: changes
    if: fromJSON(needs.changes.outputs.run).java
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER || matrix.os }}
    timeout-minutes: ${{ matrix.os == 'macos-latest' && vars.MAC_RUNNER && 120 || 60 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # chloedb-java builds for a generic CPU: one cache on every runner.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: chloedb-java
          key: java
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      # The ci profile, as the crates' tests have.
      - name: Build and test on Java 11
        working-directory: chloedb-java
        run: mvn -B -ntp -Dcargo.profile=ci package
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Test on Java 25
        working-directory: chloedb-java
        run: mvn -B -ntp -Dcargo.profile=ci -Dcargo.skip=true test
      - name: Native library's own tests
        working-directory: chloedb-java
        run: cargo test --locked --profile ci
      - name: Clippy
        working-directory: chloedb-java
        run: cargo clippy --locked --release --all-targets -- -A clippy::style -A clippy::complexity -A clippy::perf -D warnings

  # The one check main requires: every job above passed, or was skipped
  # because the change touches only the documentation. A failed or
  # cancelled job fails it. It does not wait for `macos`, the ChloeDB tests
  # on macOS of a push to main (see the top of this file).
  # The documentation site's pages (docs/site/docs/, written by
  # docs/site/scripts/build_docs.py from docs/guide/ and the Markdown
  # under docs/) are up to date with their sources. Every change: an edit
  # of docs/chloedb/*.md changes a page too.
  docs-site:
    name: Documentation site is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: python3 docs/site/scripts/build_docs.py --check
        run: |
          pip install -r docs/site/scripts/requirements.txt
          python docs/site/scripts/build_docs.py --check
      # The pages a newcomer follows use the new names (Strata and Engram are
      # the old ones), and the Python modules and extras the docs name exist,
      # marked "since" where the latest release lacks them (its tag, fetched).
      - name: Old names, and the documented Python modules
        run: |
          python scripts/check-old-names.py
          v=$(python -c 'import json; print(json.load(open("docs/site/versions.json"))["latest"])')
          git fetch --no-tags --depth 1 origin "refs/tags/chloedb-py-v$v:refs/tags/chloedb-py-v$v" || echo "::warning::no tag chloedb-py-v$v"
          python scripts/check-documented-python.py

  # Every code block of the guide's pages (docs/guide/*.md,
  # docs/quickstart.md) runs, in order, against this commit's programs, and
  # prints what the page shows (docs/guide/run.py).
  # The programs the guide's pages use besides chloedb-server, each built
  # in a job of its own, at the same time as the others and as server-bin,
  # and kept by the git trees it is built from (as server-bin is). In one
  # job, one after the other and each compiling ChloeDB again, they took
  # 20 of the docs job's 22 minutes (the pages themselves, 28 seconds).
  docs-bins:
    name: guide program ${{ matrix.crate }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.result == 'success' && fromJSON(needs.changes.outputs.run).docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        crate: [chloedb-crawl, chloedb-sheets, chloectx, chloedb-py]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Source key
        id: key
        run: echo "key=docs-bin-${{ matrix.crate }}-${{ runner.os }}-${RUST_TOOLCHAIN}-py3.12-$(git rev-parse HEAD:chloedb HEAD:${{ matrix.crate }} | sha256sum | cut -c1-24)" | tee -a "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        id: cache
        with:
          path: .docs-bin
          key: ${{ steps.key.outputs.key }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        if: steps.cache.outputs.cache-hit != 'true' && matrix.crate == 'chloedb-py'
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: ${{ matrix.crate }}
          key: docs-${{ matrix.crate }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{ matrix.crate }}
        run: |
          mkdir -p ../.docs-bin
          if [ "${{ matrix.crate }}" = chloedb-py ]; then
            pip install maturin
            maturin build --locked --profile ci --interpreter python3.12 -o ../.docs-bin
          else
            cargo build --locked --profile ci
            cp "target/ci/${{ matrix.crate }}" ../.docs-bin/
          fi
      # Saved from pull requests too: a binary is small, and a pull
      # request's next push of an untouched crate takes it from here.
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: .docs-bin
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: docs-bin-${{ matrix.crate }}
          path: .docs-bin/
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true

  docs:
    name: Documentation site and its examples
    needs: [changes, server-bin, docs-bins]
    if: ${{ !cancelled() && needs.server-bin.result == 'success' && needs.docs-bins.result == 'success' && fromJSON(needs.changes.outputs.run).docs }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      # chloedb-server's binary from job server-bin, the other programs and
      # the Python package's wheel from docs-bins, where run.py looks for
      # them (each crate's target/ci).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chloedb-server
          path: chloedb-server/target/release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: docs-bin-*
          path: .docs-bin
      - name: The programs the pages use
        run: |
          chmod +x chloedb-server/target/release/chloedb-server && chloedb-server/target/release/chloedb-server --version
          for crate in chloedb-crawl chloedb-sheets chloectx; do
            mkdir -p "$crate/target/ci"
            install -m 0755 ".docs-bin/docs-bin-$crate/$crate" "$crate/target/ci/$crate"
          done
          python -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install -r docs/guide/requirements.txt .docs-bin/docs-bin-chloedb-py/*.whl
      # The embedding models the pages name are kept between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/chloedb-docs/models
          key: docs-models-v1
      - name: Run the guide's pages
        run: |
          . "$RUNNER_TEMP/venv/bin/activate"
          python docs/guide/run.py

  # Every push to main keeps Linux x86-64 builds of its programs as one
  # archive per commit in the pre-release `main-builds`, the last 40
  # commits' (scripts/fetch-build.sh <commit> fetches one): a simulator
  # seed, a bisection or a bug report replays on the commit's own build in
  # seconds rather than after a compile. chloedb-server is server-bin's
  # release build; the others are built with the ci profile (release
  # without link-time optimisation), on the on-demand runner when it is up.
  main-builds:
    name: main's builds
    needs: [changes, runner, server-bin]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.server-bin.result == 'success' }}
    runs-on: ${{ needs.runner.outputs.label || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: chloedb-server
          path: .main-build
      - name: Build folder
        run: .github/ci-runner/target-dir.sh main-builds
      - name: Build
        run: |
          set -euo pipefail
          out="$PWD/.main-build"
          t="${CARGO_TARGET_DIR:-}"
          for spec in "chloedb-server chloedb-sim" "chloectx chloectx" "chloedb-crawl chloedb-crawl" "chloedb-sheets chloedb-sheets" "chloedb-netops chloedb-netops"; do
            set -- $spec
            (cd "$1" && cargo build --locked --profile ci --bin "$2")
            cp "${t:-$1/target}/ci/$2" "$out/"
          done
          sha=$(git rev-parse --short=12 HEAD)
          tar -C "$out" -czf "chloedb-main-$sha-linux-x86_64.tar.gz" .
          sha256sum "chloedb-main-$sha-linux-x86_64.tar.gz" | tee "chloedb-main-$sha-linux-x86_64.tar.gz.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: main-build
          path: chloedb-main-*-linux-x86_64.tar.gz*
          retention-days: 1
          if-no-files-found: error

  main-builds-publish:
    name: main's builds, published
    needs: main-builds
    if: ${{ !cancelled() && needs.main-builds.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: main-builds-publish
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: main-build
      - name: Upload to the pre-release main-builds, keep the last 40 commits
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view main-builds >/dev/null 2>&1; then
            gh release create main-builds --prerelease --latest=false --target "$GITHUB_SHA" --title "main's builds" \
              --notes "Linux x86-64 builds of each recent commit of main (chloedb-server, chloedb-sim, chloectx, chloedb-crawl, chloedb-sheets, chloedb-netops), for debugging. Not a release: scripts/fetch-build.sh <commit> fetches one."
          fi
          gh release upload main-builds chloedb-main-*-linux-x86_64.tar.gz* --clobber
          gh api "repos/$GH_REPO/releases/tags/main-builds" --paginate --jq '.assets[] | [.id, .created_at, .name] | @tsv' \
            | grep 'tar.gz$' | sort -k2 -r | tail -n +41 | while IFS=$'\t' read -r id _ name; do
              echo "removing $name"
              gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
              sid=$(gh api "repos/$GH_REPO/releases/tags/main-builds" --jq ".assets[] | select(.name == \"$name.sha256\") | .id")
              [ -n "$sid" ] && gh api -X DELETE "repos/$GH_REPO/releases/assets/$sid"
            done

  ci-result:
    name: CI result
    if: always()
    needs: [changes, server-bin, test, kernels, vision, audio, datafusion, faults, relevance-gate, relevance-gate-cross-encoder, miri, server-smoke, python, python-gate, javascript, java, docs-site, docs-bins, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          bad = {k: v["result"] for k, v in json.load(sys.stdin).items() if v["result"] not in ("success", "skipped")}
          for k, r in sorted(bad.items()):
              print(f"{k}: {r}")
          sys.exit(1 if bad else 0)
          '
