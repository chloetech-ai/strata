name: Image (app engine)

# The app engine's image, which the operator runs beside a cluster
# (spec.apps): ghcr.io/chloetech-ai/chloedb-apps, for x86-64 and arm64 in
# one tag, as image.yml does for chloedb-server.
#
# A run of CI on main that passed (CI runs the engine's tests in its
# server-smoke job) publishes the commit it tested as `latest` and as its
# full sha, as image.yml does for chloedb-server: a commit whose CI failed
# is never published, and only CI's runs of this repository's main count,
# not a fork's pull request from a branch called main. A pull request that
# changes the engine's image builds both images and publishes nothing. A
# run started by hand publishes the branch it runs on, as its sha only.
#
# The image copies chloedb-server out of chloedb-server's `latest` (for an
# engine run alone, without a cluster); nothing else in it is Rust, so each
# architecture builds in minutes, and it is rebuilt after every green run
# on main, so that it follows chloedb-server's `latest` too.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - "chloedb-apps/deploy/Dockerfile"
      - "chloedb-apps/deploy/Dockerfile.dockerignore"
      - "chloedb-apps/package.json"
      - "chloedb-apps/package-lock.json"
      - ".github/workflows/image-apps.yml"
  workflow_dispatch:

# A run that builds nothing (its CI run failed or was cancelled) has a group
# of its own, so that it cannot cancel the build of the last green commit;
# CI's runs by hand and at night are in a group apart from its pushes.
concurrency:
  group: image-apps-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && format('{0}:{1}:{2}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch, github.event.workflow_run.event) || format('nothing-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/chloetech-ai/chloedb-apps
  PUSH: ${{ github.event_name != 'pull_request' }}
  # The commit built: the one CI tested, for a run CI started.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: app engine image (${{ matrix.arch }})
    # Only after CI passed on this repository's main (a run CI started), or
    # for a pull request or a run by hand.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: chloedb-apps
          file: chloedb-apps/deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUSH == 'true' }}
          load: ${{ env.PUSH != 'true' }}
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.description=The app engine (chloedb-apps) that runs beside a ChloeDB cluster
          cache-from: type=gha,scope=image-apps-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-apps-${{ matrix.arch }}
      # The image starts: its browser, its model client and its server.
      - if: env.PUSH != 'true'
        run: |
          docker run --rm --entrypoint sh "$IMAGE:${{ env.SHA }}-${{ matrix.arch }}" -c '
            /opt/node_modules/.bin/claude --version && chloedb-server --version &&
            cd /opt/chloedb-apps && node -e "require(\"/opt/node_modules/playwright\").chromium.launch().then((b) => b.close())"'

  publish:
    name: app engine image (publish)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=(-t "$IMAGE:${{ env.SHA }}")
          # `latest` moves only forward along main (see image.yml).
          if [ "$EVENT" = workflow_run ]; then
            move_latest=true
            cur=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '.["linux/amd64"].config.Labels["org.opencontainers.image.revision"] // empty' || true)
            if [ -n "$cur" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$cur...$SHA" --jq .status || echo unknown)
              echo "latest is $cur; $SHA is $status of it"
              case "$status" in ahead|identical) ;; *) move_latest=false ;; esac
            fi
            if [ "$move_latest" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          fi
          docker buildx imagetools create "${tags[@]}" "$IMAGE:${{ env.SHA }}-amd64" "$IMAGE:${{ env.SHA }}-arm64"
          docker buildx imagetools inspect "$IMAGE:${{ env.SHA }}"
