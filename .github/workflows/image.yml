name: Image

# chloedb-server's image, for clusters the command center's Cloud view
# plans: ghcr.io/chloetech-ai/chloedb-server, for x86-64 and arm64 (AWS
# Graviton) in one tag. ChloeDB was called Strata, and for a release every
# tag is also published as ghcr.io/chloetech-ai/strata-server, the same
# image (the same digest), so that a cluster that follows the old name
# keeps getting new versions.
#
# A run of CI on main that passed publishes the commit it tested as `latest`
# and as its full sha: a commit whose CI failed or was cancelled is never
# published, so a cluster that follows `latest` runs only tested code. Only
# CI's runs of this repository's main count (a push, the nightly run or a
# run by hand): a pull request from a fork whose branch is also called
# `main` starts a CI run whose head branch is `main` too, and must not
# publish. A release tag, chloedb-server-v<version> (or strata-server-v),
# publishes `<version>` and the sha once release-gate.yml has checked that
# the tag is on main and that CI's full matrix passed on it: that is the
# tag to pin in production, `latest` moves with main. A pull request that
# changes the Dockerfile or this workflow builds both images and publishes
# nothing, so a broken image shows before it merges. A run started by hand
# publishes the branch it runs on, as its sha only.
#
# Each architecture builds on a runner of its own (GitHub's arm64 runners
# are free for a public repository, and Rust under emulation would take
# hours) and is pushed as `<sha>-amd64` and `<sha>-arm64`; the last job
# joins them under the tags the nodes pull.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ["chloedb-server-v*", "strata-server-v*"]
  pull_request:
    paths:
      - "chloedb-server/deploy/Dockerfile"
      - "chloedb-server/deploy/Dockerfile.dockerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

# A newer push to main replaces an older one still building; each pull
# request keeps one run.
# (A CI run's group names its repository as well as its branch, so that a
# fork's pull request from a branch called main cannot cancel main's.) Only
# a run that builds is in that group: one started by a CI run that failed or
# was cancelled builds nothing, and must not cancel the build of the last
# green commit, so it has a group of its own. CI's runs by hand and at night
# are in a group apart from its pushes, so that the run a release tag needs
# on an older commit cannot cancel the build of main's newest.
concurrency:
  group: image-${{ github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request' && format('{0}:{1}:{2}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch, github.event.workflow_run.event) || format('nothing-{0}', github.run_id)) || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/chloetech-ai/chloedb-server
  # The old name, published for a release beside the new one.
  OLD_IMAGE: ghcr.io/chloetech-ai/strata-server
  PUSH: ${{ github.event_name != 'pull_request' }}
  # The commit built: the one CI tested, for a run CI started.
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # For a release tag: the tag is on main and CI's full matrix passed on its
  # commit. Any other run passes it at once.
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read

  build:
    name: image (${{ matrix.arch }})
    needs: gate
    # Only after CI passed on this repository's main (a run CI started), or
    # for a release tag, a pull request or a run by hand.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: env.PUSH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: chloedb-server/deploy/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: ${{ env.PUSH == 'true' }}
          provenance: mode=min
          tags: ${{ env.IMAGE }}:${{ env.SHA }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SHA }}
            org.opencontainers.image.description=chloedb-server, with the crawler, the spreadsheets, the network operations app and ChloeCtx
          cache-from: type=gha,scope=image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=image-${{ matrix.arch }}

  publish:
    name: image (publish)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: One tag for both architectures, under both names
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # `latest` moves only forward along main: the nightly run tests
          # main as it was at 03:17 and can finish after a later push's run,
          # and must not take `latest` back to an older commit.
          move_latest=false
          if [ "$EVENT" = workflow_run ]; then
            move_latest=true
            cur=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{json .Image}}' 2>/dev/null \
              | jq -r '.["linux/amd64"].config.Labels["org.opencontainers.image.revision"] // empty' || true)
            if [ -n "$cur" ]; then
              status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$cur...$SHA" --jq .status || echo unknown)
              echo "latest is $cur; $SHA is $status of it"
              case "$status" in ahead|identical) ;; *) move_latest=false ;; esac
            fi
          fi
          for repo in "$IMAGE" "$OLD_IMAGE"; do
            tags=(-t "$repo:$SHA")
            if [ "$move_latest" = true ]; then tags+=(-t "$repo:latest"); fi
            # chloedb-server-v0.2.0 is published as 0.2.0.
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then tags+=(-t "$repo:${GITHUB_REF_NAME##*-v}"); fi
            docker buildx imagetools create "${tags[@]}" "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
            docker buildx imagetools inspect "$repo:$SHA"
          done
