name: reserve names

# Publishes the placeholders in packaging/chloedb/, version 0.0.3 of
# `chloedb` on PyPI, npm and crates.io, which hold the name until releases
# go out under it. Run by hand (Actions, "reserve names", Run workflow),
# naming the registries; each is its own job and needs its own setup first:
#
# * PyPI: a trusted publisher for the project chloedb (pypi.org, Publishing:
#   owner chloetech-ai, repository chloedb, workflow reserve-names.yml,
#   environment pypi). No token is stored anywhere.
# * npm: the repository secret NPM_TOKEN, an npm token that can publish.
# * crates.io: the repository secret CARGO_REGISTRY_TOKEN, a crates.io token
#   with the publish-new scope.
#
# A registry refuses a version it already holds, so a second run fails for
# the registries that took it and changes nothing there. npm and crates.io
# are skipped once the real package is there (js-release.yml and
# crate-release.yml publish it, 0.1 and later): on npm a placeholder
# published after it would become `latest`, and on both it would be a
# version nobody should pick. PyPI keeps its placeholder on purpose: pip
# takes it only where no wheel fits, and it says how to build there.
on:
  workflow_dispatch:
    inputs:
      registries:
        description: "Registries to publish to, any of: pypi npm crates"
        default: "pypi npm crates"

permissions:
  contents: read

jobs:
  pypi:
    if: contains(inputs.registries, 'pypi')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build packaging/chloedb/python --outdir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  npm:
    if: contains(inputs.registries, 'npm')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Publish
        working-directory: packaging/chloedb/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          latest=$(npm view chloedb version 2> /dev/null || true)
          case "$latest" in
            "" | 0.0.*) ;;
            *) echo "npm has the real chloedb ($latest): no placeholder"; exit 0 ;;
          esac
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::the repository secret NPM_TOKEN is not set"; exit 1; }
          npm publish --access public --provenance

  crates:
    if: contains(inputs.registries, 'crates')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Publish
        working-directory: packaging/chloedb/rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          latest=$(curl -fsS -A "chloedb-reserve-names (github.com/chloetech-ai/chloedb)" https://crates.io/api/v1/crates/chloedb | jq -r '.crate.max_version' || true)
          case "$latest" in
            "" | null | 0.0.*) ;;
            *) echo "crates.io has the real chloedb ($latest): no placeholder"; exit 0 ;;
          esac
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "::error::the repository secret CARGO_REGISTRY_TOKEN is not set"; exit 1; }
          cargo publish
