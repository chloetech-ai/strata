name: chloedb-py release

# Prebuilt chloedb-py: a wheel per platform, so that installing the package
# needs no Rust and no C compiler (building it from source took 12 minutes
# on 4 cores). The extension is built for CPython's stable ABI (abi3,
# Python 3.10 and later), so one wheel per platform serves every Python.
#
# A tag chloedb-py-v<version> (chloedb-py/pyproject.toml's version; the
# old name, strata-py-v<version>, works too) builds and tests every
# platform and attaches the wheels to the tag's GitHub release (a draft
# until release-publish.yml finds the whole version there), from
# which `pip install chloedb -f <the release's assets page>` picks the
# one for its machine; a run started by hand does the same and keeps
# them as the run's artifacts.
#
# PyPI: a tag also publishes the wheels to PyPI as `chloedb`, so that
# `pip install chloedb` takes them, once the repository variable
# CHLOEDB_PUBLISH_PYPI is `true`; until then nothing goes to PyPI. Setup,
# once: on pypi.org, the project chloedb's Publishing page, a trusted
# publisher with owner chloetech-ai, repository chloedb, workflow
# py-release.yml and environment pypi (no token is stored anywhere); in
# this repository's settings, an environment `pypi` (with required
# reviewers, so that each upload waits for a person) and the variable.
# PyPI refuses a version it already holds, so a tag publishes once.
# A tag builds nothing unless it is on main and CI's full matrix passed on
# its commit (release-gate.yml): the tests here check the packages, CI's
# check the code.
on:
  push:
    tags: ["chloedb-py-v*", "strata-py-v*"]
  workflow_dispatch:
  # A change to the release itself builds every platform as a release does,
  # without releasing.
  pull_request:
    paths:
      - .github/workflows/py-release.yml

permissions:
  contents: read

env:
  # The Rust every job builds with, so that a new stable release on the
  # runners cannot turn main red (clippy 1.100 did, on 12 Nov 2026). Bump it
  # by hand, after `cargo +<new> clippy` passes in each crate.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag releases only a commit of main on which CI's full matrix passed
  # (release-gate.yml says how to start that run when it is missing).
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read

  build:
    name: ${{ matrix.platform }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in the manylinux_2_28 container (AlmaLinux 8, glibc 2.28),
          # so the wheel installs on that and later: RHEL 8 and 9, Amazon
          # Linux 2023, Debian 10 and newer, Ubuntu 20.04 and newer.
          - { platform: linux-x86_64, os: ubuntu-22.04, manylinux: "2_28" }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm, manylinux: "2_28" }
          - { platform: macos-arm64, os: macos-latest, compat: "" }
          - { platform: macos-x86_64, os: macos-15-intel, compat: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # macOS 11 and later load it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: The tag names pyproject.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python3 -c 'import tomllib; print(tomllib.load(open("chloedb-py/pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "chloedb-py-v$v" || test "$GITHUB_REF_NAME" = "strata-py-v$v"
      - name: Build the wheel
        if: ${{ !matrix.manylinux }}
        working-directory: chloedb-py
        shell: bash
        run: |
          pip install "maturin>=1.9,<2"
          maturin build --release --locked --out dist
          ls -la dist
      # On Linux, inside the manylinux container, with Rust installed there
      # (the runner's arm64 machines build the aarch64 wheel natively).
      - name: Build the wheel (manylinux_${{ matrix.manylinux }})
        if: ${{ matrix.manylinux }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: chloedb-py
          manylinux: ${{ matrix.manylinux }}
          maturin-version: "1.16.0"
          args: --release --locked --out dist
      # The tag the docs promise (glibc 2.28 and later): a wheel built on a
      # newer glibc would be tagged for it, and pip on RHEL 8 or Ubuntu 20.04
      # would pass it over for PyPI's placeholder.
      - name: The wheel
        if: ${{ matrix.manylinux }}
        run: |
          ls -la chloedb-py/dist
          ls chloedb-py/dist/*manylinux_${{ matrix.manylinux }}_*.whl
          ! ls chloedb-py/dist/*.whl | grep -v "manylinux_${{ matrix.manylinux }}_"
      # The wheel installs into an empty virtualenv, with no Rust to build
      # anything with, and the embedded tests run against it there.
      - name: Install the wheel and test it
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --only-binary :all: "$GITHUB_WORKSPACE"/chloedb-py/dist/*.whl pytest numpy
          cd "$RUNNER_TEMP"
          python -c '
          import chloedb, strata
          assert chloedb is strata
          db = chloedb.open("notes.strata", schema={"table": "notes", "key": "id", "fields": [{"name": "id", "type": "int"}, {"name": "body", "type": "text"}]})
          db.upsert([{"id": 1, "body": "rivers and mountains"}, {"id": 2, "body": "the sea"}])
          hits = db.search("river")
          assert hits.keys == [1], hits.dicts()
          db.close()
          print("chloedb installed and searched:", chloedb.__file__)
          '
          # The tests, and the models they read from beside them, outside
          # the checkout, so that `import chloedb` is the wheel's.
          mkdir -p "$RUNNER_TEMP/chloedb-py" "$RUNNER_TEMP/chloedb/tests"
          cp -r "$GITHUB_WORKSPACE/chloedb-py/tests" "$RUNNER_TEMP/chloedb-py/tests"
          cp -r "$GITHUB_WORKSPACE/chloedb/tests/models" "$RUNNER_TEMP/chloedb/tests/models"
          python -m pytest -q "$RUNNER_TEMP/chloedb-py/tests/test_database.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chloedb-py-${{ matrix.platform }}
          path: chloedb-py/dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chloedb-py-*
          path: dist
          merge-multiple: true
      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # A draft: release-publish.yml publishes it with the version's others.
            gh release create "$TAG" --repo "$REPO" --draft --latest=false --title "chloedb for Python ${TAG##*-v}" --notes "Prebuilt chloedb (ChloeDB, formerly Strata) wheels for CPython 3.10 and later; no Rust needed: \`pip install chloedb -f https://github.com/$REPO/releases/expanded_assets/$TAG\` picks the one for your machine. Platforms: Linux x86_64 and aarch64 (glibc 2.28 or later), macOS arm64 and x86_64 (macOS 11 or later)."
          fi
          # A checksum of each wheel, to check a download by (sha256sum -c).
          (cd dist && sha256sum *.whl > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" dist/*.whl dist/SHA256SUMS --repo "$REPO" --clobber

  # To PyPI, once the repository variable CHLOEDB_PUBLISH_PYPI is `true`
  # (the header says what else it needs): the same wheels the release has.
  pypi:
    name: PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && vars.CHLOEDB_PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/chloedb/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chloedb-py-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
