name: strata-py release

# Prebuilt strata-py: a wheel per platform, so that installing the package
# needs no Rust and no C compiler (building it from source took 12 minutes
# on 4 cores). The extension is built for CPython's stable ABI (abi3,
# Python 3.10 and later), so one wheel per platform serves every Python.
#
# A tag strata-py-v<version> (strata-py/pyproject.toml's version) builds and
# tests every platform and attaches the wheels to the tag's GitHub release,
# from which `pip install strata-db -f <the release's assets page>` picks
# the one for its machine; a run started by hand does the same and keeps
# them as the run's artifacts. Publishing to PyPI comes later.
on:
  push:
    tags: ["strata-py-v*"]
  workflow_dispatch:
  # A change to the release itself builds every platform as a release does,
  # without releasing.
  pull_request:
    paths:
      - .github/workflows/py-release.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on glibc 2.35, so tagged manylinux_2_35: the wheel installs
          # on that and later (Debian 12, Ubuntu 22.04, RHEL 10 and newer),
          # as strata-js's addon runs.
          - { platform: linux-x86_64, os: ubuntu-22.04, compat: manylinux_2_35 }
          - { platform: linux-aarch64, os: ubuntu-22.04-arm, compat: manylinux_2_35 }
          - { platform: macos-arm64, os: macos-latest, compat: "" }
          - { platform: macos-x86_64, os: macos-15-intel, compat: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # macOS 11 and later load it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag names pyproject.toml's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "strata-py-v$(python3 -c 'import tomllib; print(tomllib.load(open("strata-py/pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - name: Build the wheel
        working-directory: strata-py
        shell: bash
        run: |
          pip install "maturin>=1.9,<2"
          maturin build --release --out dist ${{ matrix.compat && format('--compatibility {0}', matrix.compat) || '' }}
          ls -la dist
      # The wheel installs into an empty virtualenv, with no Rust to build
      # anything with, and the embedded tests run against it there.
      - name: Install the wheel and test it
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          . "$RUNNER_TEMP/venv/bin/activate"
          pip install --only-binary :all: "$GITHUB_WORKSPACE"/strata-py/dist/*.whl pytest numpy
          cd "$RUNNER_TEMP"
          python -c '
          import strata
          db = strata.open("notes.strata", schema={"table": "notes", "key": "id", "fields": [{"name": "id", "type": "int"}, {"name": "body", "type": "text"}]})
          db.upsert([{"id": 1, "body": "rivers and mountains"}, {"id": 2, "body": "the sea"}])
          hits = db.search("river")
          assert hits.keys == [1], hits.dicts()
          db.close()
          print("strata-db installed and searched:", strata.__file__)
          '
          # The tests, and the models they read from beside them, outside
          # the checkout, so that `import strata` is the wheel's.
          mkdir -p "$RUNNER_TEMP/strata-py" "$RUNNER_TEMP/strata/tests"
          cp -r "$GITHUB_WORKSPACE/strata-py/tests" "$RUNNER_TEMP/strata-py/tests"
          cp -r "$GITHUB_WORKSPACE/strata/tests/models" "$RUNNER_TEMP/strata/tests/models"
          python -m pytest -q "$RUNNER_TEMP/strata-py/tests/test_database.py"
      - uses: actions/upload-artifact@v7
        with:
          name: strata-py-${{ matrix.platform }}
          path: strata-py/dist/*.whl
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: strata-py-*
          path: dist
          merge-multiple: true
      - name: Attach the wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "strata-py ${TAG#strata-py-v}" --notes "Prebuilt strata-db wheels for CPython 3.10 and later; no Rust needed: \`pip install strata-db -f https://github.com/$REPO/releases/expanded_assets/$TAG\` picks the one for your machine. Platforms: Linux x86_64 and aarch64 (glibc 2.35 or later), macOS arm64 and x86_64 (macOS 11 or later)."
          fi
          gh release upload "$TAG" dist/*.whl --repo "$REPO" --clobber
