name: Chaos

# Every night, chloedb-chaos (chloedb-server/src/bin/chloedb-chaos) plays its
# scenarios on a cluster of chloedb-server processes on one runner: 2 shards
# of 3 copies, 2 spares and 2 coordinators, with clients that search, read
# by key and add to counters through the coordinators. The scenarios crash
# and lose nodes, cut and slow links, freeze and throttle processes, fill
# disks, flip bits on disk, wipe a volume, give a copy the wrong token,
# flood the cluster with queries and kill a coordinator mid-move. After
# each one the writers' ledger is checked. The run fails when a counter
# is below its acknowledged adds (a lost write) or above the adds that may
# have applied (a write applied twice), or when a scenario could not be
# played.
#
# It is not part of CI result: it takes about half an hour, and the
# timings it records depend on a shared runner. A pull request runs one
# scenario with its tests instead (chloedb-server/tests/chaos.rs, a primary
# killed under writes). The summary of a run is results.md, and the
# artifact keeps results.json and events.jsonl for 14 days.
on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      scenarios:
        description: "The scenarios to play, comma-separated (chloedb-chaos run --list); empty: every one"
        required: false
        default: ""

# The jobs only read the repository: the token gets no write rights.
permissions:
  contents: read

concurrency:
  group: chaos
  cancel-in-progress: false

env:
  # The Rust every job builds with, so that a new stable release on the
  # runners cannot turn main red (clippy 1.100 did, on 12 Nov 2026). Bump it
  # by hand, after `cargo +<new> clippy` passes in each crate.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  chaos:
    name: chloedb-chaos scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: chloedb-server
          key: chloedb-chaos
      - name: Build
        working-directory: chloedb-server
        run: cargo build --locked --profile ci --bin chloedb-server --bin chloedb-chaos
      # Cutting links takes iptables rules per process uid, and full disks
      # a tmpfs per server: both need root. Each server runs as a uid of its
      # own, which cannot reach the runner's home, so the binaries (side by
      # side: chloedb-chaos starts the chloedb-server beside it) and the
      # cluster's directory are outside it.
      - name: Play the scenarios
        shell: bash
        env:
          SCENARIOS: ${{ inputs.scenarios }}
        run: |
          set -o pipefail
          sudo install -d -m 755 /opt/chloedb-chaos
          sudo install -m 755 chloedb-server/target/ci/chloedb-chaos chloedb-server/target/ci/chloedb-server /opt/chloedb-chaos/
          sudo /opt/chloedb-chaos/chloedb-chaos run --dir /tmp/chloedb-chaos --disk-mb 512 ${SCENARIOS:+--scenarios "$SCENARIOS"} 2>&1 | tee "$RUNNER_TEMP/chaos.log"
      - name: Summary
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/chloedb-chaos/results.md ]; then cat /tmp/chloedb-chaos/results.md >> "$GITHUB_STEP_SUMMARY"; fi
          sudo cp /tmp/chloedb-chaos/results.md /tmp/chloedb-chaos/results.json /tmp/chloedb-chaos/events.jsonl "$RUNNER_TEMP/" 2>/dev/null || true
          sudo chown "$(id -u)" "$RUNNER_TEMP"/results.* "$RUNNER_TEMP"/events.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: chaos-results
          path: |
            ${{ runner.temp }}/results.md
            ${{ runner.temp }}/results.json
            ${{ runner.temp }}/events.jsonl
            ${{ runner.temp }}/chaos.log
          retention-days: 14
          if-no-files-found: warn
