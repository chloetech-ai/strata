name: chloedb-js release

# Prebuilt chloedb-js: the addon built once per platform, so that installing
# the package needs no Rust and no C compiler. Each platform's package is a
# tarball of the JavaScript and its addon (chloedb-js/scripts/pack.mjs),
# which `npm install <tarball or its URL>` takes as it is.
#
# A tag chloedb-js-v<version> (chloedb-js/package.json's version; the old
# name, strata-js-v<version>, works too) builds and tests every platform
# and attaches the tarballs to the tag's GitHub release (a draft until
# release-publish.yml finds the whole version there); a run started by
# hand does the same and keeps them as the run's artifacts.
# A tag builds nothing unless it is on main and CI's full matrix passed on
# its commit (release-gate.yml): the tests here check the packages, CI's
# check the code.
#
# npm: each build also packs what npm's registry gets, as napi-rs lays it
# out (scripts/pack.mjs --npm): a package per platform, @chloedb/<platform>,
# holding its addon, and `chloedb`, the JavaScript, which names each of them
# as an optional dependency, so that `npm install chloedb` installs the one
# of its machine. A tag publishes them, platforms first, once the
# repository variable CHLOEDB_PUBLISH_NPM is `true`; until then nothing goes
# to npm. A run started by hand on the release's tag publishes them too,
# when asked to (the first publish, or one that stopped partway), without
# touching the GitHub release:
#
#   gh workflow run js-release.yml --ref chloedb-js-v0.3.4 -f npm=true
#
# Setup, once: on npmjs.com, the organization `chloedb` (for the scope
# @chloedb, which does not exist yet) and a granular token that may publish
# `chloedb` (whose 0.0.x placeholders came from packaging/chloedb/npm: the
# token's account must be one of its maintainers) and `@chloedb/*`, stored
# as the secret NPM_TOKEN of the environment `npm` (with required
# reviewers, so that each publish waits for a person); then, for tags, the
# variable. npm refuses a version it already holds, and the job skips a
# package npm has at this version, so running it again finishes a publish
# that stopped partway.
on:
  push:
    tags: ["chloedb-js-v*", "strata-js-v*"]
  workflow_dispatch:
    inputs:
      npm:
        description: "Publish to npm (only on a release tag, chloedb-js-v<version>)"
        type: boolean
        default: false
  # A change to the release itself builds every platform as a release does,
  # without releasing.
  pull_request:
    paths:
      - .github/workflows/js-release.yml
      - chloedb-js/scripts/**

permissions:
  contents: read

env:
  # The Rust every job builds with, so that a new stable release on the
  # runners cannot turn main red (clippy 1.100 did, on 12 Nov 2026). Bump it
  # by hand, after `cargo +<new> clippy` passes in each crate.
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # A tag releases only a commit of main on which CI's full matrix passed
  # (release-gate.yml says how to start that run when it is missing).
  gate:
    uses: ./.github/workflows/release-gate.yml
    permissions:
      contents: read
      actions: read

  build:
    name: ${{ matrix.platform }}
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # glibc 2.35: the addon runs on that and later (Debian 12,
          # Ubuntu 22.04, RHEL 10 and newer).
          - { platform: linux-x64-gnu, os: ubuntu-22.04 }
          - { platform: linux-arm64-gnu, os: ubuntu-22.04-arm }
          - { platform: darwin-arm64, os: macos-latest }
          - { platform: darwin-x64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # macOS 11 and later load it.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: The tag names package.json's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(node -p 'require("./chloedb-js/package.json").version')
          test "$GITHUB_REF_NAME" = "chloedb-js-v$v" || test "$GITHUB_REF_NAME" = "strata-js-v$v"
      - name: Build
        working-directory: chloedb-js
        run: node scripts/build.mjs --locked
      - name: Test
        working-directory: chloedb-js
        run: node --test test/database.test.mjs
      - name: Pack
        working-directory: chloedb-js
        run: |
          node scripts/pack.mjs ${{ matrix.platform }}
          node scripts/pack.mjs --npm ${{ matrix.platform }}
          node scripts/pack.mjs --npm-main
      # The tarball installs into an empty app and runs there, without
      # building anything (a cargo that fails would fail the install).
      - name: Install the tarball and use it
        run: |
          mkdir "$RUNNER_TEMP/app" && cd "$RUNNER_TEMP/app"
          npm init -y > /dev/null
          CARGO=false npm install --no-audit --no-fund "$GITHUB_WORKSPACE"/chloedb-js/dist/*.tgz
          node --input-type=module -e '
            import { open, version } from "chloedb";
            const db = await open("notes.strata", { schema: { table: "notes", key: "id", fields: [{ name: "id", type: "int" }, { name: "body", type: "text" }] } });
            await db.upsert([{ id: 1, body: "rivers and mountains" }, { id: 2, body: "the sea" }]);
            const hits = await db.search("river");
            if (hits.length !== 1 || hits.at(0).id !== 1) throw new Error("search found " + JSON.stringify(hits.objects()));
            await db.close();
            console.log(`chloedb ${version}: installed and searched on ${process.platform}-${process.arch}`);
          '
      # The packages npm will get: `chloedb` and this platform's addon,
      # installed together into an empty app (the other platforms' optional
      # packages left out, as npm leaves them out on this machine), load the
      # addon from the platform's package.
      - name: Install the npm packages and use them
        run: |
          mkdir "$RUNNER_TEMP/npm-app" && cd "$RUNNER_TEMP/npm-app"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --omit=optional "$GITHUB_WORKSPACE"/chloedb-js/dist/npm/chloedb-${{ matrix.platform }}-*.tgz "$GITHUB_WORKSPACE"/chloedb-js/dist/npm/chloedb-[0-9]*.tgz
          test ! -e node_modules/chloedb/chloedb.node
          node --input-type=module -e '
            import { open, version } from "chloedb";
            const db = await open("notes.chloedb", { schema: { table: "notes", key: "id", fields: [{ name: "id", type: "int" }, { name: "body", type: "text" }] } });
            await db.upsert([{ id: 1, body: "rivers and mountains" }]);
            if ((await db.search("river")).length !== 1) throw new Error("search found nothing");
            await db.close();
            console.log(`chloedb ${version} from npm packages: the addon of @chloedb/${{ matrix.platform }}`);
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chloedb-js-${{ matrix.platform }}
          path: chloedb-js/dist/*.tgz
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: chloedb-js-npm-${{ matrix.platform }}
          path: chloedb-js/dist/npm/*.tgz
          if-no-files-found: error

  # Only for the tag's push: a run by hand on the tag (to publish to npm)
  # leaves the release's tarballs as they are.
  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chloedb-js-[ld]*
          path: dist
          merge-multiple: true
      - name: Attach the tarballs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la dist
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            # A draft: release-publish.yml publishes it with the version's others.
            gh release create "$TAG" --repo "$REPO" --draft --latest=false --title "chloedb for JavaScript ${TAG##*-v}" --notes "Prebuilt chloedb (ChloeDB, formerly Strata) for Node, Bun and Deno: \`npm install\` the tarball of your platform (its URL works too); no Rust needed. Platforms: linux-x64-gnu, linux-arm64-gnu (glibc 2.35 or later), darwin-arm64, darwin-x64 (macOS 11 or later)."
          fi
          # A checksum of each tarball, to check a download by (sha256sum -c).
          (cd dist && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
          gh release upload "$TAG" dist/*.tgz dist/SHA256SUMS --repo "$REPO" --clobber

  # To npm, for a tag once the repository variable CHLOEDB_PUBLISH_NPM is
  # `true`, or on a run by hand on a tag with npm=true (the header says what
  # else it needs): each platform's package, then `chloedb`, which depends
  # on them.
  npm:
    name: npm
    needs: build
    if: >-
      startsWith(github.ref, 'refs/tags/') &&
      (vars.CHLOEDB_PUBLISH_NPM == 'true' || (github.event_name == 'workflow_dispatch' && inputs.npm))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/chloedb
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: chloedb-js-npm-*
          path: npm
          merge-multiple: true
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo "::error::the npm environment's secret NPM_TOKEN is not set"; exit 1; }
          npm whoami > /dev/null || { echo "::error::npm does not take NPM_TOKEN (expired, or not a publish token)"; exit 1; }
          ls -la npm
          publish() {
            name=$(tar -xzOf "$1" package/package.json | node -p 'const p = JSON.parse(require("fs").readFileSync(0, "utf8")); p.name + "@" + p.version')
            if [ -n "$(npm view "$name" version 2> /dev/null)" ]; then echo "npm has $name already"; return; fi
            npm publish "$1" --access public --provenance
          }
          # chloedb-<platform>-<version>.tgz: the platforms' packages.
          for f in npm/chloedb-*-*-*.tgz; do publish "$f"; done
          # Every platform's builds put the same `chloedb` package here; one is published.
          publish "$(ls npm/chloedb-[0-9]*.tgz | head -n 1)"
