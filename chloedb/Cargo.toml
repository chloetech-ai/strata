[package]
name = "chloedb"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "An embedded, single-file search database: full text, structured and vector indexes behind SQL"
repository = "https://github.com/chloetech-ai/chloedb"
homepage = "https://chloetech-ai.github.io/chloedb/"
readme = "README.md"
keywords = ["search", "database", "sql", "full-text", "vector"]
categories = ["database-implementations", "text-processing"]
# crates.io gets the library and its programs' sources only: the tests'
# fixtures, the results, reports and notes stay here (they are about 60 MB,
# and a crate may be 10 MB). `.github/workflows/crate-release.yml` packages
# and verifies it, and publishes it on a run started by hand.
include = ["/src/**", "/Cargo.toml", "/Cargo.lock", "/README.md", "/DESIGN.md"]

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
csv = "1"
sqlparser = { version = "0.59", features = ["visitor"] }
crc32fast = "1"
# SHA-256 of codebook files (semantic IDs, `sid`) and of MEDIA files.
sha2 = "0.10"
libc = "0.2"
# Log events (flush and merge failures, a database that stops writing);
# silent unless the program installs a subscriber, as chloedb-server does.
tracing = { version = "0.1", default-features = false, features = ["std"] }
lz4_flex = "0.11"
flate2 = "1"
# The doc store of a table with `compression = 'zstd'` (`forward::store`).
zstd = { version = "0.13", default-features = false }
bitpacking = "0.9.3"
rand = "0.8"
rand_distr = "0.4"
# Reference implementation in the posting-list comparison (`postings::codecs::external`).
roaring = "0.11.5"
clap = { version = "4", features = ["derive"] }
rust-stemmers = "1.2"
# The `standard` analyzer and the languages' (src/text/standard.rs): NFKC,
# and ICU's dictionaries for Thai, Lao, Khmer and Burmese words. The
# dictionaries decide what a term is, so they are pinned: another version
# of them is another version of those analyzers.
unicode-normalization = "0.1"
icu_segmenter = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
icu_segmenter_data = "=2.4.0"
# The substring index (`substring`): libsais sorts a part's suffixes. The C
# library, built by `cc` without OpenMP, through its raw bindings.
libsais-sys = { version = "0.2", default-features = false }
# MEDIA values (`media`): bytes given as base64.
base64 = "0.23"
# SQLite (bundled, with FTS5): importing and exporting SQLite databases
# (feature `sqlite`, `chloedb::sqlite`) and the SQLite baseline (`baselines`).
rusqlite = { version = "0.41", features = ["bundled", "functions"], optional = true }
tantivy = { version = "0.26", optional = true }
# Embedding models for VECTOR fields declared with `embed` (`embed`):
# Model2Vec by default, BERT encoders through candle with `bert`.
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
candle-core = { version = "0.11", optional = true }
candle-nn = { version = "0.11", optional = true }
candle-transformers = { version = "0.11", optional = true }
# candle's matrix products, here only to turn on their AVX-512 kernels,
# which run where the CPU has AVX-512 (checked at run time).
gemm = { version = "0.19", features = ["x86-v4"], optional = true }
# ONNX Runtime, for cross-encoders exported to ONNX, int8 ones among them
# (`onnx`): its static library is downloaded at build time and linked in.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-native"], optional = true }
# Images decoded for SigLIP (`vision`).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"], optional = true }
# Audio decoded for Whisper (`audio`): WAV, FLAC, MP3, Ogg Vorbis, AAC in MP4.
# Hosted embedding models (`hosted`): blocking HTTPS, with rustls and ring.
ureq = { version = "3.5", default-features = false, features = ["rustls"], optional = true }
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4"], optional = true }
# DataFusion as the engine of a plan's operators (`datafusion`,
# `chloedb::query::df`): joins, groups, sorts and DISTINCT above the search
# leaves, on Arrow batches. Without its SQL front end, Parquet and
# compression: Strata keeps its own parser and planner.
datafusion = { version = "=55.2.0", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
# Parquet files in and out (`parquet`, `chloedb::parquet`), on the Arrow
# that DataFusion brings: Snappy (Spark's and pandas' default), Zstandard
# (what exports write), LZ4 and gzip (in Rust, zlib-rs).
parquet = { version = "59.3", default-features = false, features = ["arrow", "snap", "zstd", "lz4", "flate2-zlib-rs"], optional = true }
# Files on S3 and S3-compatible stores (`s3`, `chloedb::objects`): imports
# read `s3://` URLs and exports write them.
object_store = { version = "0.13.2", default-features = false, features = ["aws"], optional = true }
futures = { version = "0.3", default-features = false, features = ["std"], optional = true }

[features]
default = ["embed", "hosted"]
embed = ["dep:tokenizers"]
# Embedding models behind an HTTP API: OpenAI, Cohere, Voyage, Gemini,
# Mistral, Jina, Ollama, and servers of their APIs (`chloedb::hosted`).
hosted = ["dep:ureq"]
bert = ["embed", "dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:gemm"]
# Models exported to ONNX (`model.onnx`), run by ONNX Runtime: cross-encoders,
# embedding models (`OnnxEmbedder`) and learned sparse models (`SparseEncoder`).
onnx = ["embed", "dep:ort"]
# Images: decoded with the `image` crate, embedded by SigLIP.
vision = ["bert", "dep:image"]
# Audio: decoded with symphonia, transcribed by Whisper.
audio = ["bert", "dep:symphonia"]
# `bert` with matrix products in Apple's Accelerate framework (macOS only).
accelerate = ["bert", "candle-core/accelerate", "candle-nn/accelerate", "candle-transformers/accelerate"]
# Importing SQLite databases into Strata and exporting Strata to SQLite
# (`chloedb::sqlite`).
sqlite = ["dep:rusqlite"]
# SQLite and Tantivy baselines and the `chloedb-baselines` experiment binary.
baselines = ["dep:rusqlite", "dep:tantivy"]
# Power losses, full disks and failing syncs for tests (`storage::io`).
fault-injection = []
# DataFusion runs plans' operators with `ExecOptions::engine` (or
# CHLOEDB_ENGINE=datafusion): `chloedb::query::df`.
datafusion = ["dep:datafusion", "dep:tokio"]
# Importing Parquet files into Strata tables and exporting tables to
# Parquet (`chloedb::parquet`), and rows as Arrow batches and back
# (`chloedb::arrow_rows`).
parquet = ["datafusion", "dep:parquet"]
# `s3://` URLs wherever imports read files and exports write them
# (`chloedb::objects`): AWS S3, and S3-compatible stores such as
# DigitalOcean Spaces, MinIO and Cloudflare R2.
s3 = ["dep:object_store", "dep:tokio", "tokio/net", "tokio/time", "dep:futures"]

[[bin]]
name = "chloedb-baselines"
path = "src/bin/chloedb-baselines.rs"
required-features = ["baselines"]

[[bin]]
name = "chloedb-media-eval"
path = "src/bin/chloedb-media-eval.rs"
required-features = ["vision"]

[[bin]]
name = "chloedb-asr-eval"
path = "src/bin/chloedb-asr-eval.rs"
required-features = ["audio"]

[[bin]]
name = "chloedb-clap-eval"
path = "src/bin/chloedb-clap-eval.rs"
required-features = ["audio"]

[[example]]
name = "df_join"
required-features = ["datafusion"]

[[example]]
name = "sparse_beir"
required-features = ["onnx"]

[dev-dependencies]
tempfile = "3"
# PNGs written by the tests of `vision`.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2

# CI's tests (cargo test --profile ci): release's optimisation without its
# link-time optimisation and single codegen unit, which made linking the
# hundred test binaries, each with all of Strata in it, most of CI's time.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
