[package]
name = "chloedb-workbench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Many Claude Code sessions side by side, each in a terminal and a worktree, their state kept in ChloeDB"
publish = false

[[bin]]
name = "chloedb-workbench"
path = "src/main.rs"

[dependencies]
# The state database, embedded; no embedding models or hosted APIs.
chloedb = { path = "../chloedb", default-features = false }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
portable-pty = "0.9"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The hook and MCP subcommands: blocking HTTP to the server on loopback.
ureq = { version = "3.5", default-features = false, features = ["json"] }
libc = "0.2"
rand = "0.8"

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.24"

[profile.release]
codegen-units = 1
lto = "thin"
debug = "line-tables-only"

[profile.test]
opt-level = 2

# CI's tests (cargo test --profile ci): release's optimisation without its
# link-time optimisation and single codegen unit, which take most of the
# time of building the test binaries.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
