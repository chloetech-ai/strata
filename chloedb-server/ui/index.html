<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChloeDB command center</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/ui/brand/chloedb-icon.svg" type="image/svg+xml">
<script>
  // ChloeDB was called Strata: what this browser kept under strata.* moves to chloedb.*, once.
  try { for (const s of [localStorage, sessionStorage]) for (let i = s.length - 1; i >= 0; i--) { const k = s.key(i); if (k && k.startsWith("strata.")) { const n = "chloedb." + k.slice(7); if (s.getItem(n) == null) s.setItem(n, s.getItem(k)); s.removeItem(k); } } } catch (e) {}
  // The theme the viewer picked, before the page paints.
  try { const t = JSON.parse(localStorage.getItem("chloedb.cc.theme")); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="stylesheet" href="/ui/app.css">
<script type="module" src="/ui/main.js"></script>
</head>
<body>
<div id="app"><div style="display:grid;place-items:center;height:100vh;color:#858c97;font:14px system-ui,sans-serif">Loading the command center…</div></div>
<noscript>The command center needs JavaScript. The API is at /v1/ and the metrics at /metrics.</noscript>
</body>
</html>
