[package]
name = "chloedb-server"
version = "0.3.3"
edition = "2021"
# Integration tests are the targets below, not one per file in tests/.
autotests = false
license = "Apache-2.0"
description = "Strata over the network: HTTP JSON and gRPC, a coordinator over shards, and a query UI"

[dependencies]
mimalloc = { version = "0.1", optional = true, default-features = false }
# SQLite files in and out (`chloedb-server import`, `chloedb-server export`).
chloedb = { path = "../chloedb", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The tables a statement names, for keys limited to tables (`scoped.rs`):
# ChloeDB's own parser (`chloedb::query::parse`), its AST walked.
sqlparser = { version = "0.59", features = ["visitor"] }
# Where a word goes on (the OpenSearch API's standard tokenizer: combining marks).
unicode-segmentation = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "io-std", "io-util", "process"] }
axum = "0.7"
# Answers gzip-compressed for clients that ask (the command center polls large JSON).
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["compression-gzip"] }
# gzip: the OpenTelemetry Collector sends OTLP logs gzip-compressed by default.
tonic = { version = "0.12", features = ["tls", "tls-webpki-roots", "gzip"] }
prost = "0.13"
# "stream": request bodies sent as they are made (chloedb-stream-bench, tests/stream.rs).
# "rustls-tls-native-roots-no-provider": only for `tls_built_in_native_certs(false)`
# in `http_client`, since object_store (feature s3) turns native roots on.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots-no-provider", "stream"] }
futures = "0.3"
tokio-stream = { version = "0.1", features = ["net"] }
# TLS for the HTTP listener (tonic serves gRPC's), with ring as tonic does.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
# Answers and request bodies wrapped by the listeners (`listener`).
http-body = "1"
# Logs: text or JSON lines on stderr, filtered by level per module.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "json"] }
libc = "0.2"
# The slot hash (`slots`): xxh3, 64 bits.
twox-hash = { version = "2", default-features = false, features = ["xxhash3_64"] }
# The stacks of sampled allocations (`heap`).
backtrace = "0.3"
# SQLite files sent to `/v1/import` and written for `/v1/export`.
tempfile = "3"
# API keys are kept as the SHA-256 of their secrets (`keys`).
# A new cluster's CA, and EKS's tokens (the cloud view).
base64 = "0.23"
sha2 = "0.11"
# Postgres's sign-in (`postgres::wire`): SCRAM-SHA-256's HMAC, and MD5;
# and the public CAs a TLS certificate of verify-full is checked against.
hmac = "0.12"
md-5 = "0.10"
webpki-roots = "1"
# AWS answers in XML (EC2: instance types, regions, spot prices; `aws`).
roxmltree = "0.20"
# Kafka (Redpanda) topics for engine-compare's stream test: a client in Rust alone.
rskafka = { version = "0.6", default-features = false }
# engine-compare's traffic simulator (`plan`, `replay`): seeded draws,
# profiles in TOML, latency histograms, gzip-compressed schedule files.
rand = "0.8"
rand_distr = "0.4"
rand_chacha = "0.3"
toml = "0.8"
hdrhistogram = { version = "7.5", default-features = false }
flate2 = "1"

# CPU profiles (`profiler`): every thread's stack, sampled on SIGPROF.
[target.'cfg(unix)'.dependencies]
pprof = { version = "0.15", default-features = false }

[features]
default = ["datafusion", "parquet", "s3", "mimalloc"]
# mimalloc under the server's counting allocator (`heap`), in place of the
# system's: on a coordinator under load, glibc's malloc and free were a
# quarter of its CPU time.
mimalloc = ["dep:mimalloc"]
# DataFusion as the engine of joins, groups and sorts over a few thousand
# rows or more (`chloedb::query::df`); the default engine picks it by size.
datafusion = ["chloedb/datafusion"]
# Parquet files in and out: `import` and `export`, `POST /v1/import` and
# `GET /v1/export` with format=parquet (`chloedb::parquet`).
parquet = ["datafusion", "chloedb/parquet"]
# `s3://` URLs in `import` and `export` (`chloedb::objects`).
s3 = ["chloedb/s3"]
# BERT embedding models (bge-small-en-v1.5, snowflake-arctic-embed-m-v1.5) through candle.
bert = ["chloedb/bert"]
# `bert` with matrix products in Apple's Accelerate framework (macOS only).
accelerate = ["chloedb/accelerate"]
# Cross-encoders, embedding models and learned sparse models exported to
# ONNX, int8 ones among them, run by ONNX Runtime.
onnx = ["chloedb/onnx"]
# Images: decoded, and embedded by SigLIP (siglip-base-patch16-224).
vision = ["chloedb/vision"]
# Sound: decoded (WAV, FLAC, MP3, Ogg Vorbis, AAC), and transcribed by
# Whisper (whisper-small).
audio = ["chloedb/audio"]

[build-dependencies]
tonic-build = "0.12"
protox = "0.7"

[dev-dependencies]
# tests/mcp.rs runs `chloedb-server mcp` as a child process.
tokio = { version = "1", features = ["process"] }
# The operator's manifests read in a test, to keep src/cloud/install.rs the same.
serde_yaml = "0.9"
# PNGs written by the tests of `vision`.
image = { version = "0.25", default-features = false, features = ["png"] }

# CI's tests (cargo test --profile ci). The same as release, which keeps
# cargo's defaults here; every crate's CI runs the ci profile.
[profile.ci]
inherits = "release"

# Integration tests (tests/all.rs says why).
[[test]]
name = "all"
path = "tests/all.rs"

# Timing: a join's full time against its time to a deadline, which other tests' load skews.
[[test]]
name = "cancel"
path = "tests/cancel.rs"

# The process's CPU profiler, one profile at a time.
[[test]]
name = "cpu_profile"
path = "tests/cpu_profile.rs"

# A global allocator of its own (heap::Counting).
[[test]]
name = "heap_profile"
path = "tests/heap_profile.rs"

# The process's log subscriber (obs::init_logs).
[[test]]
name = "logstore"
path = "tests/logstore.rs"

# CI's vision job builds it alone.
[[test]]
name = "media"
path = "tests/media.rs"

# CI's vision job builds it alone.
[[test]]
name = "media_vectors"
path = "tests/media_vectors.rs"

# A global allocator of its own (heap::Counting).
[[test]]
name = "node_profile"
path = "tests/node_profile.rs"

# The process's log subscriber, which keeps every test's lines.
[[test]]
name = "observability"
path = "tests/observability.rs"

# Timing: rollout gates held for seconds, which other tests' load stretches.
[[test]]
name = "operator"
path = "tests/operator.rs"

# The process's log subscriber (obs::init_logs).
[[test]]
name = "workload"
path = "tests/workload.rs"
