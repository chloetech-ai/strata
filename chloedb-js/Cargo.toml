[package]
name = "chloedb-node"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "JavaScript bindings for ChloeDB: the database in-process, as a Node-API addon"
publish = false

[lib]
name = "chloedb_node"
crate-type = ["cdylib"]

[dependencies]
# Node-API 8 (Node 12.22 and later; Bun and Deno load it too).
napi = { version = "3", default-features = false, features = ["napi8", "dyn-symbols"] }
napi-derive = "3"
chloedb = { path = "../chloedb", features = ["sqlite"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[features]
default = ["datafusion", "parquet", "s3"]
# DataFusion as the engine of joins, groups and sorts over a few thousand
# rows or more (`chloedb::query::df`); the default engine picks it by size.
datafusion = ["chloedb/datafusion"]
# Parquet files in and out (`fromParquet`, `importParquet`,
# `exportParquet`).
parquet = ["datafusion", "chloedb/parquet"]
# `s3://` URLs wherever a file is read or written (`chloedb::objects`).
s3 = ["chloedb/s3"]
# BERT embedding models (`bert`), with Apple's Accelerate on a Mac
# (`accelerate`); Model2Vec models need neither.
bert = ["chloedb/bert"]
accelerate = ["chloedb/accelerate"]
# Cross-encoders exported to ONNX (`onnx`), run by ONNX Runtime.
onnx = ["chloedb/onnx"]
# Images (`vision`): decoded, and embedded by SigLIP.
vision = ["chloedb/vision"]
# Sound (`audio`): decoded, and transcribed by Whisper.
audio = ["chloedb/audio"]

[profile.release]
codegen-units = 1
lto = "thin"
# The addon is what an install downloads: without its symbol table it is a
# third smaller (its exports, which Node reads, stay).
strip = "symbols"

# CI's tests: release's optimisation without its link-time optimisation and
# single codegen unit, which take most of the time of building the addon.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
