[package]
name = "strata-py"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for Strata: the database in-process"
publish = false

[lib]
name = "_strata"
crate-type = ["cdylib"]

[dependencies]
# One wheel for CPython 3.10 and later (the stable ABI).
pyo3 = { version = "0.30", features = ["abi3-py310"] }
strata = { path = "../strata", features = ["sqlite"] }
serde_json = "1"
# Answers as Arrow (`Database.query_arrow`), handed to Python through the
# Arrow C stream interface: the Arrow that DataFusion, and so Strata, uses.
arrow-array = { version = "59", default-features = false, features = ["ffi"], optional = true }
arrow-schema = { version = "59", default-features = false, features = ["ffi"], optional = true }

[features]
default = ["datafusion"]
# DataFusion as the engine of joins, groups and sorts over a few thousand
# rows or more (`strata::query::df`); the default engine picks it by size.
# Answers as Arrow tables (`Database.query_arrow`) come with it.
datafusion = ["strata/datafusion", "dep:arrow-array", "dep:arrow-schema"]
# BERT embedding models (`bert`), with Apple's Accelerate on a Mac
# (`accelerate`); Model2Vec models need neither.
bert = ["strata/bert"]
accelerate = ["strata/accelerate"]
# Cross-encoders exported to ONNX (`onnx`), run by ONNX Runtime.
onnx = ["strata/onnx"]
# Images (`vision`): decoded, and embedded by SigLIP.
vision = ["strata/vision"]
# Sound (`audio`): decoded, and transcribed by Whisper.
audio = ["strata/audio"]

[profile.release]
codegen-units = 1
lto = "thin"
