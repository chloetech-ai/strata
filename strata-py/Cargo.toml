[package]
name = "strata-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for Strata: the database in-process"
publish = false

[lib]
name = "_strata"
crate-type = ["cdylib"]

[dependencies]
# One wheel for CPython 3.10 and later (the stable ABI).
pyo3 = { version = "0.30", features = ["abi3-py310"] }
strata = { path = "../strata", features = ["sqlite"] }
serde_json = "1"

[features]
# BERT embedding models (`bert`), with Apple's Accelerate on a Mac
# (`accelerate`); Model2Vec models need neither.
bert = ["strata/bert"]
accelerate = ["strata/accelerate"]
# Images (`vision`): decoded, and embedded by SigLIP.
vision = ["strata/vision"]

[profile.release]
codegen-units = 1
lto = "thin"
