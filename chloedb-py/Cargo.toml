[package]
name = "chloedb-py"
version = "0.3.3"
edition = "2021"
license = "Apache-2.0"
description = "Python bindings for Strata: the database in-process"
publish = false

[lib]
name = "_strata"
crate-type = ["cdylib"]

[dependencies]
# One wheel for CPython 3.10 and later (the stable ABI).
pyo3 = { version = "0.30", features = ["abi3-py310"] }
chloedb = { path = "../chloedb", features = ["sqlite"] }
serde_json = "1"
# Answers as Arrow (`Database.query_arrow`), handed to Python through the
# Arrow C stream interface: the Arrow that DataFusion, and so Strata, uses.
arrow-array = { version = "59", default-features = false, features = ["ffi"], optional = true }
arrow-schema = { version = "59", default-features = false, features = ["ffi"], optional = true }

[features]
default = ["datafusion", "parquet", "s3"]
# DataFusion as the engine of joins, groups and sorts over a few thousand
# rows or more (`chloedb::query::df`); the default engine picks it by size.
# Answers as Arrow tables (`Database.query_arrow`) come with it.
datafusion = ["chloedb/datafusion", "dep:arrow-array", "dep:arrow-schema"]
# Parquet files in and out (`from_parquet`, `Database.import_parquet`,
# `Database.export_parquet`), and rows from any Arrow source
# (`Database.import_arrow`).
parquet = ["datafusion", "chloedb/parquet"]
# `s3://` URLs wherever a file is read or written (`chloedb::objects`).
s3 = ["chloedb/s3"]
# BERT embedding models (`bert`), with Apple's Accelerate on a Mac
# (`accelerate`); Model2Vec models need neither.
bert = ["chloedb/bert"]
accelerate = ["chloedb/accelerate"]
# Cross-encoders exported to ONNX (`onnx`), run by ONNX Runtime.
onnx = ["chloedb/onnx"]
# Images (`vision`): decoded, and embedded by SigLIP.
vision = ["chloedb/vision"]
# Sound (`audio`): decoded, and transcribed by Whisper.
audio = ["chloedb/audio"]

[profile.release]
codegen-units = 1
lto = "thin"

# CI's tests (maturin develop --profile ci): release's optimisation without
# its link-time optimisation and single codegen unit, which take most of the
# time of building the extension.
[profile.ci]
inherits = "release"
codegen-units = 16
lto = false
