# The coordinator: answers queries over HTTP by asking every shard of a set
# over gRPC and merging. It holds no data, so it can run several replicas.
# --shards lists the shards, comma-separated, and each shard's replicas
# joined by '|': one replica of each shard answers a query, another when it
# fails or has not answered after --hedge-ms (default 100). `kind-test.sh
# coordinator N R [ARGS...]` points it at the set of N shards × R replicas,
# adding ARGS (such as --partial --shard-timeout-ms=500).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: strata-coordinator
  namespace: strata
spec:
  replicas: 1
  selector:
    matchLabels: {app: strata-coordinator}
  template:
    metadata:
      labels: {app: strata-coordinator}
    spec:
      containers:
        - name: strata
          image: strata-server:dev
          imagePullPolicy: IfNotPresent
          # A test cluster, served open (see README.md, Security).
          args:
            - --listen=0.0.0.0:7700
            - --no-token
            - --shards=http://strata-shards-2-s0-0.strata-shards-2:7701|http://strata-shards-2-s0-1.strata-shards-2:7701,http://strata-shards-2-s1-0.strata-shards-2:7701|http://strata-shards-2-s1-1.strata-shards-2:7701
          ports:
            - {name: http, containerPort: 7700}
          # Ready once it listens: it does not ask its shards, so one slow
          # shard cannot take every coordinator out of service together.
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 2
          # Keep answering for a few seconds after the pod is told to stop,
          # while the Service drops it: without this, moving the coordinator
          # to another set of shards lost ~10 s of queries to connections
          # sent to the old pod's address after it was gone.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: strata-coordinator
  namespace: strata
spec:
  selector: {app: strata-coordinator}
  ports:
    - {name: http, port: 7700}
