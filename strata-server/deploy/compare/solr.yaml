# Solr: node __I__ of a 2-node SolrCloud cluster (one shard of the
# collection each, no replicas), with the same CPU and memory as a data pod
# of the other engines. solr-0 also runs ZooKeeper, embedded (ZK_HOST
# empty); solr-1 uses it. The index lives on the node's own disk (emptyDir).
# compare.sh writes solr-0 and solr-1 from this file, each on its own node.
apiVersion: v1
kind: Service
metadata:
  name: solr
  namespace: compare
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: solr}
  ports:
    - {name: http, port: 8983}
    - {name: zk, port: 9983}
---
apiVersion: v1
kind: Pod
metadata:
  name: solr-__I__
  namespace: compare
  labels: {app: solr, engine: solr}
spec:
  hostname: solr-__I__
  subdomain: solr
  nodeName: __NODE__
  containers:
    - name: solr
      image: solr:10.1.0
      imagePullPolicy: IfNotPresent
      env:
        - {name: SOLR_MODE, value: solrcloud}
        - {name: SOLR_HOST, value: solr-__I__.solr.compare.svc.cluster.local}
        - {name: ZK_HOST, value: "__ZK__"}
        - {name: SOLR_OPTS, value: "-Dsolr.zookeeper.embedded.host=0.0.0.0"}
        # A third of the pod's memory: its vectors are full precision, so
        # the page cache needs room for 1 GB of them per shard.
        - {name: SOLR_HEAP, value: 1g}
      ports:
        - {name: http, containerPort: 8983}
        - {name: zk, containerPort: 9983}
      readinessProbe:
        httpGet: {path: /solr/admin/info/health, port: http}
        periodSeconds: 5
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /var/solr}
  volumes:
    - name: data
      emptyDir: {}
