# Strata: shard __I__ of 2, as in strata.yaml, with a coordinator over both
# shards in the same container, as Elasticsearch and OpenSearch answer
# queries on their data nodes. The shard and its coordinator share the
# container's CPU and memory, which are another engine's data pod's
# (DATA_CPU, DATA_MEM), so Strata then has nothing on the clients' node;
# the client sends its requests round-robin to both coordinators (port
# 7710). compare.sh writes strata-0 and strata-1 from this file (unless
# STRATA_COORD=pod). The coordinator runs in the shard's process and calls
# it in-process (--coordinator-listen), or with STRATA_COORD=shards as a
# process of its own that calls it over gRPC.
apiVersion: v1
kind: Service
metadata:
  name: strata
  namespace: __NS__
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: strata-shard}
  ports:
    - {name: http, port: 7700}
    - {name: grpc, port: 7701}
    - {name: coordinator, port: 7710}
---
apiVersion: v1
kind: Pod
metadata:
  name: strata-__I__
  namespace: __NS__
  labels: {app: strata-shard, engine: strata}
spec:
  hostname: strata-__I__
  subdomain: strata
  nodeName: __NODE__
  containers:
    - name: strata
      image: __IMAGE__
      imagePullPolicy: IfNotPresent
      # One server, or two in one container (STRATA_COORD=shards), so that
      # they share one CPU and memory limit. The coordinator waits for both
      # shards (it asks again every 2 s), so the two pods may start in
      # either order; exec leaves the shard as the container's own process,
      # which the pod's deletion stops. The deadlines are strata.yaml's and
      # strata-coordinator.yaml's.
      command: [sh, -c]
      args:
        - |
          shards=http://strata-0.strata:7701,http://strata-1.strata:7701
          if [ "$IN_PROCESS" = 1 ]; then
            exec strata-server --db /local/__COLL__.shard__I__of2.strata --listen 0.0.0.0:7700 --grpc 0.0.0.0:7701 --timeout-ms 30000 \
              --shards $shards --coordinator-listen 0.0.0.0:7710 --local-shard http://strata-__I__.strata:7701
          fi
          strata-server --listen=0.0.0.0:7710 --grpc=off --shards=$shards --timeout-ms=30000 &
          exec strata-server --db /local/__COLL__.shard__I__of2.strata --listen 0.0.0.0:7700 --grpc 0.0.0.0:7701 --timeout-ms 30000
      env:
        - {name: STRATA_TOKEN, valueFrom: {secretKeyRef: {name: strata-token, key: token}}}
        - {name: IN_PROCESS, value: "__IN_PROCESS__"}
      ports:
        - {name: http, containerPort: 7700}
        - {name: grpc, containerPort: 7701}
        - {name: coordinator, containerPort: 7710}
      # Ready when both answer.
      readinessProbe:
        exec: {command: [sh, -c, "curl -sf http://127.0.0.1:7700/v1/health >/dev/null && curl -sf http://127.0.0.1:7710/v1/health >/dev/null"]}
        periodSeconds: 2
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: local, mountPath: /local}
  volumes:
    - name: local
      hostPath: {path: /var/local/compare, type: Directory}
