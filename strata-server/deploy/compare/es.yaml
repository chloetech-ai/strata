# Elasticsearch: node __I__ of a 2-node cluster, each node master-eligible
# and holding data (one primary shard of the index each, no replicas), with
# the same CPU and memory as a data pod of the other engines. The index
# lives on the node's own disk (emptyDir), as Solr's and Strata's do.
# compare.sh writes es-0 and es-1 from this file, each on its own node.
apiVersion: v1
kind: Service
metadata:
  name: es
  namespace: compare
spec:
  clusterIP: None
  # Names resolve before a node is ready: the nodes find each other by name.
  publishNotReadyAddresses: true
  selector: {app: es}
  ports:
    - {name: http, port: 9200}
    - {name: transport, port: 9300}
---
apiVersion: v1
kind: Pod
metadata:
  name: es-__I__
  namespace: compare
  labels: {app: es, engine: es}
spec:
  hostname: es-__I__
  subdomain: es
  nodeName: __NODE__
  containers:
    - name: es
      image: elasticsearch:9.5.5
      imagePullPolicy: IfNotPresent
      env:
        - {name: node.name, value: es-__I__}
        - {name: cluster.name, value: compare}
        - {name: discovery.seed_hosts, value: "es-0.es,es-1.es"}
        - {name: cluster.initial_master_nodes, value: "es-0,es-1"}
        - {name: network.host, value: "0.0.0.0"}
        - {name: xpack.security.enabled, value: "false"}
        - {name: xpack.ml.enabled, value: "false"}
        - {name: cluster.routing.allocation.disk.threshold_enabled, value: "false"}
        # Half the pod's memory, as Elastic recommends; the rest for the page cache.
        - {name: ES_JAVA_OPTS, value: "-Xms1536m -Xmx1536m"}
      ports:
        - {name: http, containerPort: 9200}
        - {name: transport, containerPort: 9300}
      readinessProbe:
        httpGet: {path: "/_cluster/health?local=true", port: http}
        periodSeconds: 5
      resources:
        requests: {cpu: __CPU__, memory: __MEM__}
        limits: {cpu: __CPU__, memory: __MEM__}
      volumeMounts:
        - {name: data, mountPath: /usr/share/elasticsearch/data}
  volumes:
    - name: data
      emptyDir: {}
